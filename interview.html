*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;padding:16px}

.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.06)}

.bt.s{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:700;margin-top:0}
.cd{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;margin-top:8px;border-radius:14px;border:1.5px solid var(--line);background:transparent}
.cd.on{border-color:#111;background:var(--accs)}

.cd b{display:block;font-size:.98rem}
.cd small{color:var(--mute);font-size:.78rem}

.sg.on{background:var(--y);border-color:#111;color:#111;font-weight:800}
.st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.st div{background:var(--neu);border-radius:12px;padding:8px 12px;font-size:.78rem;color:var(--mute)}
.st b{display:block;font-size:1.2rem;color:var(--ink)}
.bar{height:5px;background:var(--neu);border-radius:3px;margin:8px 0 14px}.bar div{height:5px;background:var(--y);border-radius:3px;transition:width .3s}
.q{font-size:1.1rem;font-weight:900;line-height:1.9}
textarea{width:100%;resize:none;font:inherit;line-height:1.9;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.er{color:var(--bad);font-size:.82rem;min-height:20px}
.bx{border-radius:12px;padding:10px 14px;font-size:.9rem;margin-top:10px;line-height:1.9}
.ck{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:8px 12px;margin-top:6px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:.9rem}
.ck.on{border-color:#111;background:var(--accs)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
.row a{color:var(--acc);font-weight:700;text-decoration:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute)}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function best(c){var b=-1;H.forEach(function(x){if(x.c===c&&x.p>b)b=x.p});return b}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function ring(){var f=document.getElementById("rf");if(!f)return;f.setAttribute("stroke-dashoffset",(113.1*(1-T/S.d)).toFixed(1));f.setAttribute("stroke",T<=10?"var(--bad)":"#e0a800");document.getElementById("tv").textContent=fa(T)}
function tick(){clearInterval(iv);T=S.d;iv=setInterval(function(){T--;if(T<=0){T=0;clearInterval(iv);var m=document.getElementById("tm");if(m)m.textContent="زمان تمام شد؛ جوابت را ثبت کن."}ring()},1000)}
function pool(){return S.c===-1?shuffle([].concat.apply([],C.map(function(x){return x.q}))).slice(0,6):shuffle(C[S.c].q)}
function render(){
  clearInterval(iv);var h="";
  if(S.s==="start"){
    var tot=H.length,bs=0;H.forEach(function(x){if(x.p>bs)bs=x.p});
    h='<div class="h">یک دسته انتخاب کن</div><p class="m" style="margin-bottom:10px">سوال‌ها هر بار به‌صورت تصادفی می‌آیند.</p>';
    if(tot)h+='<div class="st"><div>تمرین‌های انجام‌شده<b>'+fa(tot)+'</b></div><div>بهترین نمره<b>'+fa(bs)+'٪</b></div></div>';
    C.forEach(function(x,j){var b=best(j);h+='<button class="cd'+(S.c===j?" on":"")+'" data-a="cat" data-n="'+j+'"><span class="ic">'+x.ic+'</span><span><b>'+x.n+'</b><small>'+x.d+' - '+fa(x.q.length)+' سوال'+(b>=0?' - بهترین: '+fa(b)+'٪':'')+'</small></span></button>'});
    h+='<button class="cd'+(S.c===-1?" on":"")+'" data-a="cat" data-n="-1"><span class="ic">🎲</span><span><b>تمرین ترکیبی</b><small>۶ سوال تصادفی از همه دسته‌ها</small></span></button>';
    h+='<p class="m" style="margin:14px 0 6px">زمان هر سوال</p><div>';
    [60,90,120].forEach(function(v){h+='<button class="sg'+(S.d===v?" on":"")+'" data-a="dur" data-n="'+v+'">'+fa(v)+' ثانیه</button>'});
    h+='</div><button class="bt" data-a="go">شروع تمرین</button>';
    if(tot)h+='<button class="lk" data-a="clr">پاک کردن سابقه تمرین‌ها</button>';
  }else if(S.s==="quiz"){
    var q=S.ql[S.i],nm=S.c===-1?"ترکیبی":C[S.c].n;
    h='<div class="top"><span>'+nm+' - سوال '+fa(S.i+1)+' از '+fa(S.ql.length)+'</span>';
    if(S.p==="ask")h+='<span class="rg"><svg width="46" height="46" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="rf" cx="22" cy="22" r="18" fill="none" stroke="#e0a800" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="0"/></svg><span id="tv">'+fa(S.d)+'</span></span>';
    h+='</div><div class="bar"><div style="width:'+((S.i+(S.p==="review"?1:.5))/S.ql.length*100)+'%"></div></div><p class="q">'+q[0]+'</p>';
    if(S.p==="ask"){
      h+='<textarea id="ta" rows="4" placeholder="جوابت را اینجا بنویس…"></textarea><p id="tm" class="er"></p><button class="bt" style="margin-top:2px" data-a="sub">ثبت جواب</button>';
    }else{
      h+='<div class="bx" style="background:var(--neu)"><span class="m">جواب تو</span><br>'+esc(S.a)+'</div>';
      h+='<div class="bx" style="background:var(--oks);color:var(--ok)"><b>نکته: </b>'+q[1]+'</div>';
      h+='<div class="bx" style="background:var(--accs);color:var(--acc)"><b>نمونه جواب: </b>'+q[2]+'</div>';
      h+='<p class="m" style="margin:14px 0 2px">خودت را بسنج</p>';
      K.forEach(function(t,j){h+='<button class="ck'+(S.k[j]?" on":"")+'" data-a="chk" data-n="'+j+'"><span>'+(S.k[j]?"☑":"☐")+'</span>'+t+'</button>'});
      h+='<button class="bt" data-a="next">'+(S.i+1<S.ql.length?"سوال بعد":"دیدن کارنامه")+'</button>';
    }
  }else{
    var t=0,mx=S.ql.length*3;S.r.forEach(function(x){t+=x});var pc=Math.round(t/mx*100);
    var lv=pc>=80?"آماده مصاحبه‌ای":pc>=50?"در مسیر خوبی هستی":"نیاز به تمرین بیشتر داری";
    var pb=best(S.c);
    h='<div class="rs"><svg width="96" height="96" viewBox="0 0 90 90"><circle cx="45" cy="45" r="34" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="45" cy="45" r="34" fill="none" stroke="#e0a800" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="'+(213.6*(1-pc/100)).toFixed(1)+'"/></svg><div class="p">'+fa(pc)+'٪</div><p class="h" style="margin:8px 0 12px">'+lv+'</p></div>';
    S.ql.forEach(function(q,j){var l=AT[q[3]];h+='<div class="row"><span style="flex:1">'+q[0]+(l&&S.r[j]<3?'<br><a href="articles.html#'+q[3]+'">مقاله پیشنهادی: '+l+'</a>':'')+'</span><b style="white-space:nowrap">'+fa(S.r[j])+' از ۳</b></div>'});
    h+='<div class="g2"><button class="bt s" data-a="go">تمرین دوباره</button><button class="bt s" data-a="home">دسته دیگر</button></div>';
  }
  R.innerHTML=h;if(S.s==="quiz"&&S.p==="ask"){tick();ring();var ta=document.getElementById("ta");if(ta)ta.addEventListener("input",function(){document.getElementById("tm").textContent=""})}
  window.scrollTo(0,0);
}
R.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),n=+b.getAttribute("data-n");
  if(a==="cat"){S.c=n;render()}else if(a==="dur"){S.d=n;render()}
  else if(a==="go"){S.s="quiz";S.ql=pool();S.i=0;S.p="ask";S.r=[];S.k=[0,0,0];render()}
  else if(a==="home"){S.s="start";render()}
  else if(a==="clr"){H=[];save();render()}
  else if(a==="sub"){var v=document.getElementById("ta").value.trim();if(!v){document.getElementById("tm").textContent="اول جوابت را بنویس";return}S.a=v;S.p="review";S.k=[0,0,0];render()}
  else if(a==="chk"){S.k[n]=S.k[n]?0:1;render()}
  else if(a==="next"){S.r.push(S.k[0]+S.k[1]+S.k[2]);if(S.i+1<S.ql.length){S.i++;S.p="ask";S.k=[0,0,0]}else{var t=0;S.r.forEach(function(x){t+=x});H.push({c:S.c,p:Math.round(t/(S.ql.length*3)*100),t:Date.now()});save();S.s="done"}render()}
});
render();
</script>
<script src="pwa.js" defer></script>
</body>
</html>
