var A=[
{id:"resume-basics",c:"رزومه",t:"چطور رزومه‌ای بنویسیم که واقعاً خوانده شود؟",s:"کارفرما معمولاً چند ثانیه به هر رزومه نگاه می‌کند. ساختار درست همان چند ثانیه را به نفع شما تمام می‌کند.",b:
"کارفرمایی که ده‌ها رزومه روی میزش دارد، هر کدام را در چند ثانیه مرور می‌کند. اگر در همین فرصت کوتاه نتواند بفهمد شما کی هستید و چه کاری بلدید، سراغ رزومه بعدی می‌رود. پس هدف رزومه «گفتن همه‌چیز» نیست؛ هدفش جلب‌کردن نظر برای دعوت به مصاحبه است.\n## بخش‌های ضروری\n- نام و نام خانوادگی، عنوان شغلی هدف و راه تماس (شماره موبایل و ایمیل)\n- خلاصه کوتاه دو تا سه‌جمله‌ای درباره خودتان\n- سوابق کاری، از جدیدترین به قدیمی‌ترین\n- تحصیلات\n- مهارت‌ها\n## عنوان شغلی را مشخص کنید\nرزومه‌ای که با «به‌دنبال هر کاری هستم» شروع می‌شود تاثیری ندارد. زیر نام خود بنویسید «حسابدار»، «فروشنده» یا «کمک‌پرستار». اگر برای چند شغل متفاوت درخواست می‌دهید، برای هر کدام یک نسخه جدا بسازید.\n## سوابق را با کار انجام‌شده توضیح دهید\nبه‌جای «مسئول فروش بودم» بنویسید «پاسخ‌گویی به مشتریان، چیدمان کالا و تنظیم فاکتور روزانه». هر جا عدد دارید بیاورید: تعداد مشتری، مدت کار یا میزان فروش. عدد باورپذیری رزومه را بالا می‌برد.\n## ظاهر رزومه\n- حداکثر یک تا دو صفحه\n- یک فونت خوانا و فاصله مناسب بین بخش‌ها\n- بدون غلط املایی؛ قبل از ارسال یک بار با صدای بلند بخوانید\n- ذخیره و ارسال به‌صورت PDF تا چیدمان به‌هم نریزد\nیادتان باشد رزومه ثابت نیست. هر بار که مهارت یا تجربه تازه‌ای پیدا کردید، به‌روزش کنید."},

{id:"resume-mistakes",c:"رزومه",t:"۱۰ اشتباه رایج در رزومه که شانس شما را کم می‌کند",s:"بیشتر رزومه‌ها نه به‌خاطر کم‌بودن تجربه، بلکه به‌خاطر چند اشتباه ساده کنار گذاشته می‌شوند.",b:
"این فهرست را قبل از ارسال رزومه با رزومه خودتان تطبیق بدهید.\n## اشتباه‌های ظاهری\n- غلط املایی و نگارشی\n- فونت‌های رنگارنگ و طراحی شلوغ\n- عکس نامناسب (سلفی، عکس گروهی یا عکس با فیلتر)\n- رزومه بیش از دو صفحه\n## اشتباه‌های محتوایی\n- نبودن شماره تماس یا شماره‌ای که جواب نمی‌دهد\n- ایمیل غیرحرفه‌ای؛ بهتر است از نام خودتان استفاده کنید\n- نوشتن وظایف به‌جای دستاوردها: «مسئول صندوق بودم» ضعیف‌تر از «روزانه بیش از ۸۰ فاکتور را بدون خطا ثبت می‌کردم» است\n- مهارت‌های کلی و بی‌ارتباط با شغل؛ مثلاً «اهل مطالعه» برای آگهی حسابدار کمکی نمی‌کند\n- اغراق یا دروغ در سابقه و مهارت. کارفرما معمولاً در مصاحبه یا تماس معرف متوجه می‌شود\n- ارسال یک رزومه یکسان برای همه آگهی‌ها\n## راه حل ساده\nبرای هر آگهی، یک بار شرایط را بخوانید و مهارت‌هایی را که واقعاً دارید و در آگهی آمده، در خلاصه و مهارت‌های رزومه بیاورید. همین کار در سیستم‌های غربال‌گر رزومه هم کمک می‌کند."},

{id:"interview-prep",c:"مصاحبه",t:"آماده‌سازی برای مصاحبه استخدامی؛ از شب قبل تا لحظه ورود",s:"مصاحبه‌ی موفق بیشتر از آنکه به استعداد وابسته باشد، به آمادگی قبلی وابسته است.",b:
"استرس مصاحبه طبیعی است و بهترین راه کم‌کردنش آمادگی است.\n## قبل از مصاحبه\n- درباره محل کار تحقیق کنید: چه خدماتی می‌دهند و شما در آنجا چه کاری انجام می‌دهید؟\n- آگهی را دوباره بخوانید و برای هر شرط، یک مثال از تجربه خودتان آماده کنید\n- آدرس و مسیر را بررسی کنید و ۱۰ تا ۱۵ دقیقه زودتر برسید\n- نسخه چاپی رزومه، مدارک و یک خودکار همراه داشته باشید\n- لباس تمیز و مناسب آن محیط کار انتخاب کنید\n## هنگام مصاحبه\n- با لبخند و احوال‌پرسی کوتاه شروع کنید\n- گوش بدهید و کوتاه و روشن جواب بدهید\n- مثال واقعی بزنید، نه جمله‌های کلی\n- از گفتن بد درباره کارفرمای قبلی بپرهیزید\n- دست‌کم یک سوال از خودتان بپرسید، مثلاً ساعت کاری، وظایف روزانه یا مسیر رشد\n## بعد از مصاحبه\nدر پایان تشکر کنید. اگر زمانی برای اعلام نتیجه گفته شد، همان موقع پیگیری کنید. هر مصاحبه، حتی بدون نتیجه، تمرینی برای مصاحبه بعدی است؛ همان شب بنویسید چه چیزی خوب پیش رفت و چه چیزی را می‌شود بهتر کرد."},

{id:"interview-questions",c:"مصاحبه",t:"پاسخ به سوال‌های همیشگی مصاحبه",s:"«درباره خودتان بگویید» و «نقطه ضعف شما چیست؟» تقریباً در هر مصاحبه پرسیده می‌شود. بهتر است جوابتان از قبل آماده باشد.",b:
"چند سوال هست که در بیشتر مصاحبه‌ها تکرار می‌شود. لازم نیست جواب را حفظ کنید، ولی باید فکرتان را از قبل مرتب کرده باشید.\n## «درباره خودتان بگویید»\nمنظور داستان زندگی نیست. در حدود یک دقیقه بگویید کی هستید، چه تجربه یا مهارتی مرتبط دارید و چرا برای این شغل مناسبید. نمونه: «من چهار سال در فروشگاه لوازم خانگی کار کرده‌ام، با مشتری‌ها ارتباط خوبی دارم و حالا به‌دنبال محیطی هستم که بتوانم در آن رشد کنم.»\n## «چرا می‌خواهید اینجا کار کنید؟»\nبا کمی تحقیق درباره محل کار، یک دلیل واقعی بگویید؛ مثلاً نزدیکی، شهرت مجموعه یا علاقه به آن حوزه. «چون پول لازم دارم» جواب صادقانه‌ای است ولی برای مصاحبه کافی نیست.\n## «نقطه ضعف شما چیست؟»\nیک ضعف واقعی و کوچک را بگویید و همراهش بگویید برای بهبودش چه کرده‌اید. مثلاً: «گاهی زیاد دقیق می‌شوم و کار کند می‌شود، برای همین حالا برای هر کار زمان تعیین می‌کنم.» از جواب‌های کلیشه‌ای مثل «زیادی سخت‌کوشم» دوری کنید.\n## «چرا کار قبلی را ترک کردید؟»\nبدون گله و بدگویی جواب بدهید. بگویید دنبال فرصت رشد، ساعت کاری مناسب‌تر یا کار در حوزه تخصصی خودتان بوده‌اید.\n## «انتظار حقوق شما چقدر است؟»\nقبل از مصاحبه، حقوق معمول آن شغل در شهرتان را بررسی کنید و یک بازه معقول بگویید. جزئیات بیشتر را در مقاله مذاکره حقوق بخوانید."},

{id:"azmoon-prep",c:"استخدامی",t:"برای آزمون‌های استخدامی چطور برنامه‌ریزی کنیم؟",s:"با یک برنامه ساده، منبع مشخص و تمرین مداوم می‌شود بدون فشار زیاد برای آزمون آماده شد.",b:
"در آزمون استخدامی، رقابت زیاد است و زمان محدود. نمی‌شود آخر شب‌های آخر همه‌چیز را خواند؛ آمادگی تدریجی بهتر جواب می‌دهد.\n## قدم اول: بدانید چه چیزی می‌خوانید\nآگهی یا دفترچه آزمون را با دقت بخوانید. دروس عمومی (مثل هوش، ریاضی، ادبیات فارسی، زبان) و دروس تخصصی مشخص می‌شود. به هر درس بر اساس ضریب و میزان تسلط خودتان وقت بدهید.\n## قدم دوم: برنامه واقع‌بینانه بنویسید\n- روزی ۱ تا ۲ ساعت منظم بهتر از هفته‌ای یک بار ۸ ساعت است\n- هر هفته یک روز را به مرور اختصاص بدهید\n- دروسی که ضعیف هستید را اول روز بخوانید که انرژی بیشتری دارید\n## قدم سوم: تمرین با تست\nخواندن به‌تنهایی کافی نیست. نمونه سوال بزنید، با زمان‌سنج کار کنید و بعد هر آزمون غلط‌ها را بررسی کنید. اشتباه‌های تکراری را در یک دفترچه جدا یادداشت کنید و مرتب مرور کنید.\n## نکته‌های روز آزمون\n- شب قبل خوب بخوابید\n- مدارک و کارت ورود به جلسه را از قبل آماده کنید\n- ابتدا سوال‌های آسان را جواب بدهید و روی سوال سخت زیاد نمانید\n- اگر آزمون نمره منفی دارد، سوال‌هایی که اصلاً نمی‌دانید را بی‌دلیل نزنید\nمی‌توانید با آزمون‌های آمادگی همین اپ هم تمرین کنید."},

{id:"no-experience",c:"کارجو",t:"بدون سابقه کار هم می‌شود کار پیدا کرد",s:"اگر تازه فارغ‌التحصیل شده‌اید یا هنوز کاری نداشته‌اید، این راه‌ها به شما کمک می‌کند.",b:
"«بدون سابقه به من کار نمی‌دهند» جمله‌ای است که خیلی از کارجوها می‌گویند. واقعیت این است که سابقه فقط کار رسمی نیست و راه‌هایی برای شروع وجود دارد.\n## سابقه‌های دیگر را هم بنویسید\n- کارآموزی و دوره‌های مهارتی\n- کار داوطلبانه یا فعالیت در مسجد، دانشگاه و انجمن‌ها\n- کمک در کسب‌وکار خانوادگی\n- پروژه‌های دانشجویی یا تمرین‌های شخصی\nاینها نشان می‌دهد مسئولیت‌پذیر و اهل یادگیری هستید.\n## مهارت بسازید\nدوره‌های کوتاه فنی‌وحرفه‌ای، آموزش کار با کامپیوتر و اکسل، یا آموزش زبان انگلیسی، رزومه شما را قوی می‌کند. مدرک معتبر را در رزومه ذکر کنید.\n## از مشاغل ورودی شروع کنید\nشاید شغل اول رویای شما نباشد ولی دو سه ماه کار رسمی، ارزش بالایی در رزومه دارد. بسیاری از آدم‌ها از یک شغل ساده شروع کرده و ارتقا گرفته‌اند.\n## شبکه ارتباطی را فعال کنید\nبه آشنایان، فامیل و دوستان بگویید دنبال چه کاری هستید. بخش بزرگی از فرصت‌های شغلی از راه معرفی پیدا می‌شود.\n## پیگیر باشید\nروزانه آگهی‌های معتبر را ببینید، رزومه مناسب هر آگهی را بفرستید و بعد از چند روز با ادب پیگیری کنید. نتیجه معمولاً با ادامه‌دادن می‌آید."},

{id:"job-scam",c:"کارجو",t:"چطور آگهی‌های شغلی فریبنده را تشخیص بدهیم؟",s:"درآمد خیالی، هزینه ثبت‌نام و آدرس نامشخص؛ نشانه‌هایی که باید شما را محتاط کند.",b:
"در کنار آگهی‌های درست، آگهی‌هایی هم هست که هدفشان گرفتن پول یا اطلاعات شخصی کارجوهاست. چند نشانه به شما کمک می‌کند زودتر متوجه شوید.\n## نشانه‌های خطر\n- درخواست پول برای «ثبت‌نام»، «بیمه»، «لباس فرم» یا «آموزش» پیش از شروع کار\n- وعده درآمد خیلی بالا برای کاری ساده و بدون شرایط\n- نبودن آدرس محل کار، نام شرکت یا شماره تماس ثابت\n- اصرار بر تصمیم فوری: «فقط تا امروز فرصت دارید»\n- درخواست اطلاعات حساس مثل رمز دوم کارت، کد پیامکی یا عکس کارت ملی در همان تماس اول\n## قبل از قبول کردن چه کار کنیم؟\n- نام شرکت و آدرس را جست‌وجو کنید و در صورت امکان حضوری مراجعه کنید\n- از دیگران که آنجا کار کرده‌اند بپرسید\n- مصاحبه را در محیط کاری معتبر انجام بدهید، نه در جاهای نامشخص\n- پیش از امضای قرارداد، آن را کامل بخوانید و یک نسخه از آن را نگه دارید\n## قاعده ساده\nکارفرمای معتبر برای استخدام شما از شما پول نمی‌گیرد. اگر چیزی در آگهی مشکوک به نظر می‌رسد، به حس خودتان اعتماد کنید و قبل از هر پرداخت یا ارسال مدرک، حتماً درباره آن تحقیق کنید."},

{id:"salary-talk",c:"کارجو",t:"مذاکره درباره حقوق و مزایا؛ چه بگوییم و چه نگوییم",s:"صحبت درباره پول سخت است، ولی با آمادگی می‌شود بدون تنش و با اعتمادبه‌نفس انجامش داد.",b:
"خیلی از کارجوها از گفتن عدد حقوق می‌ترسند. اما مذاکره درباره حقوق بخشی عادی از استخدام است.\n## قبل از مذاکره\n- بررسی کنید حقوق معمول این شغل در شهر شما چقدر است؛ از آگهی‌های مشابه و آدم‌های هم‌رشته کمک بگیرید\n- حداقل حقوقی را که می‌پذیرید برای خودتان مشخص کنید\n- مهارت‌ها و تجربه‌هایی را که ارزش شما را بالا می‌برد فهرست کنید\n## هنگام مذاکره\n- اول درباره وظایف و انتظارات صحبت کنید، بعد سراغ حقوق بروید\n- به‌جای یک عدد، یک بازه معقول بگویید\n- فقط حقوق پایه را نبینید؛ بیمه، پاداش، ساعت کاری، سرویس رفت‌وآمد و مرخصی هم بخشی از مزایاست\n- مودب و روشن بمانید و تهدید یا مقایسه با دیگران نکنید\n## چیزهایی که نباید گفت\n- «هر چقدر بدهید قبول می‌کنم»\n- گفتن عدد خیلی پایین از ترس رد‌شدن\n- دروغ درباره حقوق قبلی\n## بعد از توافق\nتوافق نهایی (حقوق، بیمه، ساعت کار و تاریخ شروع) را در قرارداد یا حداقل به‌صورت مکتوب بگیرید. توافق شفاهی در صورت اختلاف، اثبات سختی دارد."},

{id:"cover-letter",c:"رزومه",t:"متن همراه رزومه؛ چند خط که تفاوت می‌سازد",s:"وقتی رزومه را ایمیل یا پیام می‌کنید، دو سه جمله مناسب شانس دیده‌شدنتان را بالا می‌برد.",b:"خیلی‌ها رزومه را بدون هیچ توضیحی می‌فرستند. چند خط کوتاه همراه رزومه نشان می‌دهد آگهی را خوانده‌اید و جدی هستید.\n## ساختار پیشنهادی\n- سلام و احترام، با نام شخص یا مجموعه اگر می‌دانید\n- نوشتن عنوان شغلی که برایش درخواست می‌دهید\n- یک جمله درباره مهم‌ترین تجربه یا مهارت مرتبط\n- اعلام آمادگی برای مصاحبه و راه تماس\n## نمونه\n«سلام و وقت بخیر. برای موقعیت کارشناس فروش درخواست می‌دهم. چهار سال تجربه فروش حضوری و پاسخ‌گویی به مشتری دارم. رزومه‌ام پیوست است و برای مصاحبه در خدمتم.»\n## نکته‌ها\n- بیشتر از پنج شش خط ننویسید\n- موضوع ایمیل را مشخص کنید، مثلاً «درخواست همکاری - کارشناس فروش - نام شما»\n- غلط املایی را بررسی کنید و فایل رزومه را حتماً پیوست کنید"},

{id:"resume-ats",c:"رزومه",t:"سیستم‌های غربال رزومه چگونه کار می‌کنند؟",s:"بعضی مجموعه‌ها قبل از دیدن انسان، رزومه را با نرم‌افزار بررسی می‌کنند. چند نکته ساده شما را از این مرحله رد می‌کند.",b:"در شرکت‌های بزرگ‌تر ممکن است رزومه‌ها اول با نرم‌افزار بررسی شوند و فقط آن‌هایی که با آگهی بیشتر می‌خوانند، به دست مسئول استخدام برسند.\n## چه کار کنیم؟\n- از کلمه‌هایی استفاده کنید که در آگهی آمده، به شرطی که واقعاً با تجربه شما درست باشد\n- عنوان بخش‌ها را ساده بنویسید: سوابق کاری، تحصیلات، مهارت‌ها\n- از جدول و ستون‌بندی پیچیده بپرهیزید؛ قالب ساده بهتر خوانده می‌شود\n- عنوان شغلی را هم در بالای رزومه و هم در خلاصه بیاورید\n- فایل را با نام مشخص ذخیره کنید، مثلاً «رزومه-نام-خانوادگی»\n## یادآوری\nحتی اگر نرم‌افزار شما را رد نکند، در نهایت انسان است که تصمیم می‌گیرد. پس رزومه باید هم برای ماشین قابل‌خواندن و هم برای آدم جذاب باشد. تحلیلگر رزومه داخل همین اپ می‌تواند بخش‌های ضعیف را نشانتان بدهد."},

{id:"resume-skills",c:"رزومه",t:"کدام مهارت‌ها را در رزومه بنویسیم؟",s:"مهارت‌های درست و مرتبط، بهتر از فهرست بلند و کلی است.",b:"مهارت‌ها دو دسته‌اند و هر دو در رزومه جا دارند.\n## مهارت‌های تخصصی\nکارهایی که برای شغل لازم است و می‌شود تمرینشان کرد: کار با اکسل، حسابداری، تایپ، رانندگی، زبان انگلیسی، کار با دستگاه خاص، آشپزی، خیاطی و مانند آن.\n## مهارت‌های ارتباطی و شخصی\nکار تیمی، مدیریت زمان، حل مسئله، برخورد با مشتری و مسئولیت‌پذیری. این‌ها را بهتر است با مثال کوتاه در سوابق نشان بدهید، نه فقط اسمشان را بنویسید.\n## قاعده‌ها\n- فقط مهارتی بنویسید که در مصاحبه بتوانید درباره‌اش حرف بزنید\n- ۵ تا ۱۰ مهارت مرتبط کافی است\n- مهارت‌های مرتبط با آگهی را اول بیاورید\n- از عبارت‌های خیلی کلی مثل «باهوش» یا «خوش‌اخلاق» دوری کنید"},

{id:"resume-gap",c:"رزومه",t:"فاصله بین دو کار را چطور توضیح بدهیم؟",s:"فاصله بیکاری شرم ندارد. مهم این است که صادقانه و کوتاه درباره‌اش حرف بزنید.",b:"برای بسیاری از آدم‌ها پیش می‌آید که مدتی بیکار باشند: مهاجرت، مراقبت از خانواده، تحصیل، بیماری یا بسته‌شدن محل کار.\n## توصیه‌ها\n- دروغ نگویید و تاریخ‌ها را جابه‌جا نکنید\n- اگر در این مدت چیزی یاد گرفتید (دوره، پروژه، کار موقت)، حتماً بنویسید\n- در مصاحبه یک جواب کوتاه و آرام آماده داشته باشید\n## نمونه جواب\n«در آن مدت مراقب یکی از اعضای خانواده بودم. حالا شرایطم برگشته و آماده‌ام که کامل کار کنم. در این مدت هم دوره اکسل را گذراندم.»\nبعد از جواب، صحبت را به سمت توانایی‌هایتان ببرید. کارفرما بیشتر از گذشته به این علاقه دارد که الان چه کاری از شما برمی‌آید."},

{id:"phone-online-interview",c:"مصاحبه",t:"مصاحبه تلفنی و آنلاین؛ نکته‌های فنی و رفتاری",s:"مصاحبه از راه دور هم مثل حضوری جدی است. از چند نکته ساده غافل نشوید.",b:"خیلی از مجموعه‌ها اولین مصاحبه را تلفنی یا تصویری انجام می‌دهند.\n## قبل از تماس\n- مکانی آرام و بدون سروصدا انتخاب کنید\n- شارژ گوشی و اینترنت را چک کنید\n- رزومه و آگهی را جلوی دستتان بگذارید\n- در مصاحبه تصویری، دوربین را هم‌سطح صورت بگذارید و پس‌زمینه مرتب باشد\n## در طول مصاحبه\n- شمرده و واضح صحبت کنید\n- وسط حرف طرف مقابل نپرید\n- به‌جای نگاه به صفحه، سعی کنید به دوربین نگاه کنید\n- لباس مناسب بپوشید، حتی اگر فقط صدایتان شنیده شود\n## اگر مشکل فنی پیش آمد\nآرام باشید، عذرخواهی کوتاهی کنید و پیشنهاد دهید دوباره تماس بگیرید. شماره تماس جایگزین را از قبل آماده داشته باشید."},

{id:"body-language",c:"مصاحبه",t:"زبان بدن در مصاحبه؛ بدون حرف هم پیام می‌دهید",s:"حالت نشستن، نگاه و دست‌دادن از اولین دقیقه در ذهن مصاحبه‌کننده می‌ماند.",b:"حتی قبل از اینکه چیزی بگویید، ظاهر و رفتارتان اثر می‌گذارد.\n## چند نکته ساده\n- راست بنشینید و به صندلی تکیه نیم‌بند بدهید، نه ولو و نه خشک\n- ارتباط چشمی معتدل داشته باشید؛ خیره‌شدن و فرار از نگاه هر دو ناراحت‌کننده است\n- لبخند طبیعی بزنید\n- دست‌ها را روی میز یا روی پا قرار دهید و با خودکار و موبایل بازی نکنید\n- اگر نیاز بود با اطمینان دست بدهید، بدون فشار زیاد\n- گوشی را بی‌صدا کنید و کنار بگذارید\n## یادتان باشد\nزبان بدن جای محتوا را نمی‌گیرد، ولی مکمل آن است. اگر استرس دارید، قبل از ورود چند نفس عمیق بکشید. تمرین جلوی آینه یا با یک دوست کمک زیادی می‌کند."},

{id:"questions-to-ask",c:"مصاحبه",t:"چه سوال‌هایی در پایان مصاحبه بپرسیم؟",s:"پرسیدن سوال خوب نشان علاقه شماست و کمک می‌کند بدانید شغل برایتان مناسب است یا نه.",b:"در پایان مصاحبه معمولاً می‌پرسند «سوالی دارید؟». جواب «نه» فرصت را از دست می‌دهد.\n## نمونه سوال‌ها\n- یک روز کاری معمول در این موقعیت چگونه است؟\n- مهم‌ترین انتظار شما از کسی که استخدام می‌شود چیست؟\n- دوره آزمایشی چقدر است و چطور ارزیابی می‌شود؟\n- ساعت کاری و شیفت‌ها چگونه است؟\n- نتیجه مصاحبه چه زمانی اعلام می‌شود؟\n## سوالی که اول نپرسید\nبهتر است در همان مصاحبه اول، فقط درباره مرخصی و پاداش شروع نکنید. اول علاقه‌تان به کار و وظایف را نشان بدهید و بعد در زمان مناسب درباره حقوق و مزایا صحبت کنید."},

{id:"interview-mistakes",c:"مصاحبه",t:"اشتباه‌هایی که باعث رد شدن در مصاحبه می‌شود",s:"بیشتر این اشتباه‌ها با کمی توجه قابل جلوگیری است.",b:"گاهی تجربه کافی دارید ولی رفتار مصاحبه نتیجه را عوض می‌کند.\n## اشتباه‌های رایج\n- دیر رسیدن بدون اطلاع قبلی\n- نداشتن اطلاعات درباره محل کار\n- جواب‌های خیلی بلند یا خیلی کوتاه\n- بدگویی از کارفرمای قبلی\n- استفاده از گوشی در حین مصاحبه\n- دروغ در رزومه که در سوال‌های بعدی رو می‌شود\n- بی‌توجهی به سوال و پاسخ بی‌ربط\n- تمرکز فقط روی حقوق و مرخصی\n## راه‌حل\nقبل از مصاحبه جواب سوال‌های پرتکرار را مرور کنید، مسیر را بررسی کنید و رزومه‌تان را خوب بشناسید. بعد از هر مصاحبه، اشتباه‌ها را یادداشت کنید تا دفعه بعد تکرار نشود."},

{id:"exam-time",c:"استخدامی",t:"مدیریت زمان در جلسه آزمون",s:"حتی با دانش خوب، بدون مدیریت زمان ممکن است نتوانید همه سوال‌ها را جواب بدهید.",b:"در بسیاری از آزمون‌ها زمان از دانش مهم‌تر می‌شود.\n## قبل از آزمون\n- با زمان‌سنج تمرین کنید و ببینید برای هر سوال چقدر وقت دارید\n- هر درس را جداگانه با زمان مشخص بزنید\n## در جلسه\n- اول سراسر سوال‌ها را مرور کنید\n- سوال‌های آسان را اول جواب بدهید\n- سوال دشواری که بیش از یک تا دو دقیقه وقت می‌گیرد را علامت بزنید و بعداً برگردید\n- ۵ تا ۱۰ دقیقه آخر را برای مرور و پرکردن پاسخ‌نامه نگه دارید\n- دقت کنید پاسخ را در شماره درست پاسخ‌نامه علامت بزنید\n## نکته\nاگر آزمون نمره منفی دارد، قبل از شروع قانونش را بخوانید و بر اساس آن تصمیم بگیرید که سوال‌های مشکوک را بزنید یا نه."},

{id:"exam-anxiety",c:"استخدامی",t:"مقابله با استرس آزمون استخدامی",s:"کمی استرس طبیعی است. مهم این است که کنترلش کنید و تمرکزتان را از دست ندهید.",b:"استرس شب و روز آزمون تقریباً برای همه هست.\n## چند راه ساده\n- مرور نهایی را شب آخر زیاد سنگین نکنید و به‌جای مطالعه جدید، خلاصه‌هایتان را بخوانید\n- خواب کافی داشته باشید\n- صبح آزمون صبحانه بخورید\n- مسیر و محل آزمون را از قبل بررسی کنید\n- قبل از شروع، چند نفس آرام بکشید\n- اگر وسط آزمون ذهنتان خالی شد، از آن سوال بگذرید و به سراغ بعدی بروید\n## نگرش درست\nیک آزمون پایان دنیا نیست. اگر نتیجه دلخواه نبود، نقاط ضعف را بشناسید و برای دوره بعد برنامه بریزید. بسیاری از پذیرفته‌شدگان چند بار شرکت کرده‌اند."},

{id:"hiring-stages",c:"استخدامی",t:"مراحل معمول استخدام در مجموعه‌های دولتی",s:"در اغلب استخدام‌های رسمی چند مرحله وجود دارد. جزئیات هر مرحله را همیشه در آگهی همان استخدام بخوانید.",b:"استخدام در مجموعه‌های دولتی و شبه‌دولتی معمولاً مرحله‌به‌مرحله است و جزئیات هر دوره ممکن است متفاوت باشد.\n## مراحل کلی\n- انتشار آگهی و ثبت‌نام اینترنتی\n- بررسی شرایط عمومی و اختصاصی داوطلب\n- آزمون کتبی یا تستی\n- اعلام نتایج و دعوت به مراحل بعد\n- مصاحبه و ارزیابی تخصصی در صورت پیش‌بینی\n- بررسی مدارک و گزینش\n- اعلام نتیجه نهایی\n## توصیه‌ها\n- فقط از سایت و کانال‌های رسمی خود دستگاه اطلاعات بگیرید\n- مهلت ثبت‌نام را از آگهی یادداشت کنید\n- مدارک (شناسنامه، کارت ملی، مدرک تحصیلی و ...) را از قبل آماده کنید\n- اگر آگهی از شما هزینه خارج از ثبت‌نام رسمی خواست، حتماً راستی‌آزمایی کنید\nشرایط دقیق همیشه در آگهی رسمی هر آزمون آمده و بر هر توضیح عمومی مقدم است."},

{id:"daily-job-search",c:"کارجو",t:"برنامه روزانه برای جست‌وجوی کار",s:"جست‌وجوی منظم، بهتر از تلاش پراکنده و پرفشار است.",b:"پیدا کردن کار خودش یک کار است و برنامه می‌خواهد.\n## پیشنهاد برای هر روز\n- ۳۰ دقیقه: دیدن آگهی‌های تازه در منابع معتبر\n- ۳۰ دقیقه: فرستادن ۲ تا ۳ رزومه مناسب و متناسب با هر آگهی\n- ۱۵ دقیقه: پیگیری درخواست‌های هفته قبل\n- ۳۰ دقیقه: یادگیری مهارتی که رزومه‌تان را قوی‌تر می‌کند\n## یک جدول ساده بسازید\nنام مجموعه، تاریخ ارسال رزومه، راه تماس و وضعیت. اینطوری هیچ فرصتی گم نمی‌شود.\n## نکته‌ها\n- ارسال انبوه رزومه کلی کمتر از چند رزومه مرتبط نتیجه می‌دهد\n- بعد از یک هفته با ادب پیگیری کنید\n- استراحت را هم در برنامه بگذارید تا خسته نشوید"},

{id:"online-presence",c:"کارجو",t:"حضور حرفه‌ای آنلاین؛ از لینکدین تا شبکه‌های اجتماعی",s:"کارفرماها گاهی قبل از دعوت به مصاحبه، اسم شما را جست‌وجو می‌کنند.",b:"شبکه‌های اجتماعی هم می‌توانند به شما کمک کنند و هم ضرر بزنند.\n## نکته‌ها\n- اگر لینکدین دارید، پروفایل را کامل کنید: عکس مناسب، عنوان شغلی، سوابق و مهارت‌ها\n- در شبکه‌های شخصی، محتوای نامناسب یا بحث‌های تند را مرور کنید\n- نام کاربری حرفه‌ای انتخاب کنید\n- اگر مهارتی دارید (طراحی، آشپزی، خیاطی، برنامه‌نویسی)، نمونه‌کارهایتان را منتشر کنید\n- با افراد هم‌حوزه ارتباط بگیرید و پیام‌های مودبانه بدهید\n## یادآوری\nهیچ‌وقت اطلاعات حساس مثل کد ملی، رمز یا آدرس دقیق را عمومی منتشر نکنید. در ارتباط با آگهی‌های ناشناس هم احتیاط کنید."},

{id:"first-day",c:"محیط کار",t:"روز اول کار؛ چطور شروع خوبی داشته باشیم",s:"اولین روز نقش مهمی در تصویری دارد که همکاران از شما می‌سازند.",b:"استخدام شده‌اید و روز اول نزدیک است.\n## قبل از روز اول\n- ساعت و محل شروع را دقیق بپرسید\n- مدارک خواسته‌شده را آماده کنید\n- لباس مناسب بپوشید و زودتر برسید\n## در روز اول\n- با همه با ادب و لبخند آشنا شوید و اسم‌ها را یادداشت کنید\n- زیاد سوال بپرسید؛ سوال‌پرسیدن در روزهای اول عیب نیست\n- وظایف و انتظارات را از مسئول مستقیم‌تان بپرسید و یادداشت کنید\n- قوانین ایمنی و مقررات محیط کار را جدی بگیرید\n- سعی نکنید همه‌چیز را همان روز یاد بگیرید\n## بعد از روز اول\nمرور کنید چه چیزی یاد گرفتید و برای فردا یک هدف کوچک بگذارید. دقت و وقت‌شناسی در هفته اول بیشترین اثر را دارد."},

{id:"probation",c:"محیط کار",t:"دوره آزمایشی چیست و چطور از آن عبور کنیم؟",s:"در ماه‌های اول، کارفرما شما و شما کارفرما را می‌سنجید.",b:"بسیاری از مجموعه‌ها یک دوره آزمایشی برای نیروهای جدید در نظر می‌گیرند.\n## قبل از شروع بپرسید\n- طول دوره آزمایشی چقدر است؟\n- معیار ارزیابی چیست؟\n- شرایط حقوق و بیمه در این دوره چگونه است؟\nبهتر است این توافق‌ها مکتوب باشد.\n## برای موفقیت\n- وقت‌شناس و منظم باشید\n- دستورالعمل‌ها را با دقت دنبال کنید\n- اگر چیزی را نمی‌دانید بپرسید، نه اینکه حدس بزنید\n- کارتان را با کیفیت و به‌موقع تحویل دهید\n- بازخورد را بپذیرید و اصلاح کنید\n- با همکاران رفتار محترمانه داشته باشید\nاین دوره فرصتی است تا شما هم بفهمید این محیط برای شما مناسب است یا نه."},

{id:"labor-basics",c:"محیط کار",t:"آشنایی با کلیات حقوق کار؛ قرارداد و بیمه",s:"قبل از شروع کار، دانستن چند نکته کلی از حق شما محافظت می‌کند.",b:"این مطلب راهنمای کلی است و جای مشاوره حقوقی را نمی‌گیرد. برای جزئیات و موارد خاص به اداره کار و کارشناس حقوقی مراجعه کنید.\n## قرارداد\n- تا جای ممکن، توافق را مکتوب کنید\n- مدت قرارداد، حقوق، ساعت کار و شرح وظایف را بخوانید\n- یک نسخه از قرارداد را نزد خودتان نگه دارید\n## بیمه\nبپرسید بیمه از چه تاریخی شروع می‌شود و بر چه مبنایی است. اگر مجموعه از بیمه صحبت می‌کند، مطمئن شوید واقعاً برایتان ثبت می‌شود.\n## حقوق و مزایا\nمبلغ، روز پرداخت و روش پرداخت را از قبل مشخص کنید و رسید یا مستند پرداخت را نگه دارید.\n## در صورت اختلاف\nابتدا با مسئول مجموعه صحبت کنید. اگر حل نشد، می‌توانید از مراجع رسمی مانند اداره کار راهنمایی بگیرید."},

{id:"time-management",c:"مهارت",t:"مدیریت زمان؛ مهارتی که هر کارفرما دوست دارد",s:"کسی که زمانش را خوب اداره می‌کند، در هر شغلی کارآمدتر است.",b:"مدیریت زمان یعنی انجام کارهای مهم قبل از کارهای فوری و بی‌اهمیت.\n## روش‌های ساده\n- فهرست کارهای هر روز را صبح بنویسید\n- کارها را به «مهم و فوری»، «مهم ولی غیرفوری» و «کم‌اهمیت» تقسیم کنید\n- کار سخت را اول روز انجام بدهید\n- برای هر کار زمان تقریبی در نظر بگیرید\n- اعلان‌های گوشی را در ساعت کار محدود کنید\n- به کارهای ناتمام برنگردید؛ یک بار شروع کنید و تمام کنید\n## در رزومه و مصاحبه\nبه‌جای نوشتن «مدیریت زمان خوب»، مثال بزنید: «گزارش‌های هفتگی را همیشه قبل از موعد تحویل می‌دادم.»"},

{id:"teamwork",c:"مهارت",t:"کار تیمی و ارتباط موثر در محیط کار",s:"بسیاری از مشکلات کاری از ارتباط ضعیف شروع می‌شود، نه از نبود مهارت فنی.",b:"در بیشتر شغل‌ها با همکاران و مشتری‌ها در ارتباط هستید.\n## اصول ساده\n- خوب گوش بدهید و سپس جواب بدهید\n- روشن و محترمانه صحبت کنید\n- اگر اشتباه کردید، سریع قبول کنید و اصلاحش کنید\n- اختلاف‌نظر را خصوصی و با ادب مطرح کنید\n- قول‌هایی بدهید که می‌توانید انجام دهید\n- در موفقیت دیگران شریک شوید و قدردان باشید\n## با مشتری\nآرام باشید، حتی اگر مشتری عصبانی است. اول گوش بدهید، سپس راه حل پیشنهاد کنید. در بسیاری از موارد همین توجه، مشکل را نصف می‌کند."},

{id:"excel-start",c:"مهارت",t:"یادگیری اکسل از صفر؛ از کجا شروع کنیم؟",s:"اکسل یکی از پرتقاضاترین مهارت‌ها در مشاغل اداری، حسابداری و فروش است.",b:"لازم نیست همه‌چیز را بدانید؛ چند قابلیت پایه هم برای بیشتر آگهی‌ها کافی است.\n## مسیر پیشنهادی\n- ساخت جدول، تغییر ظاهر و مرتب‌سازی داده‌ها\n- فرمول‌های اصلی: جمع، میانگین، شمارش، حداقل و حداکثر\n- فرمول شرطی (اگر) و جست‌وجو (مثل VLOOKUP یا XLOOKUP)\n- فیلتر و جدول‌های پیوت\n- رسم نمودار ساده\n## نحوه تمرین\nروی کارهای واقعی تمرین کنید: بودجه ماهانه، فهرست مشتری‌ها یا موجودی انبار. هر روز ۲۰ تا ۳۰ دقیقه کافی است. وقتی مهارت پیدا کردید، یک نمونه فایل تمیز بسازید و در مصاحبه نشان بدهید."},

{id:"rejection",c:"کارجو",t:"وقتی جواب منفی می‌گیرید چه کنیم؟",s:"رد شدن بخش عادی مسیر پیدا کردن کار است، نه قضاوت درباره ارزش شما.",b:"تقریباً هر کسی که کار پیدا کرده، قبلش رد هم شده است.\n## چه کار کنیم؟\n- بپذیرید که ناراحت شدن طبیعی است، ولی بیش از چند روز در آن نمانید\n- اگر امکانش هست، مودبانه بپرسید که دلیل یا نقطه ضعفی وجود داشت یا نه\n- مصاحبه را مرور کنید: کدام سوال سخت بود؟ کدام جواب ضعیف بود؟\n- رزومه‌تان را دوباره مرور و اصلاح کنید\n- با آدم‌های مثبت و حمایت‌گر در ارتباط باشید\n- خودتان را با دیگران مقایسه نکنید\n- به ارسال رزومه ادامه بدهید\n## یادآوری\nگاهی دلیل رد شدن به شما ربطی ندارد: تغییر بودجه، انتخاب از داخل مجموعه یا تطابق نداشتن شرایط. تمرین و پیگیری، در بلندمدت جواب می‌دهد."},

{id:"job-seller",c:"مشاغل",t:"راهنمای کار فروشندگی؛ از رزومه تا مصاحبه",s:"فروشندگی شغلی است که بیشتر از مدرک، به رفتار و ارتباط وابسته است.",b:"فروشنده خوب کسی است که مشتری را می‌شناسد و کالا را درست معرفی می‌کند.\n## مهارت‌های مهم\n- برخورد محترمانه و صبور با مشتری\n- شناخت کالا و قیمت‌ها\n- کار با صندوق و تنظیم فاکتور\n- چیدمان و نظم فروشگاه\n## در رزومه\nتعداد مشتری روزانه، نوع کالا و مدت کار را بنویسید. در مصاحبه هم با مثال نشان دهید چطور مشتری ناراضی را آرام کرده‌اید."},

{id:"job-accountant",c:"مشاغل",t:"حسابدار شدن؛ مهارت‌ها و مسیر شروع",s:"حسابداری بدون دقت و نرم‌افزار ممکن نیست؛ از همین‌ها شروع کنید.",b:"حسابدار مبتدی باید مفاهیم پایه و کار با نرم‌افزار را بداند.\n## مهارت‌های پایه\n- اصول حسابداری و ثبت سند\n- اکسل در سطح خوب\n- آشنایی با یکی از نرم‌افزارهای حسابداری رایج\n- دقت و رازداری\n## مسیر شروع\nاز کارهای ساده مثل ثبت فاکتور، بایگانی و تنظیم گزارش شروع کنید. دوره‌های مهارتی کوتاه و تمرین با نمونه داده، رزومه شما را قوی‌تر می‌کند."},

{id:"job-secretary",c:"مشاغل",t:"منشی و مسئول دفتر؛ چه چیزهایی لازم است؟",s:"نظم، ارتباط خوب و تسلط بر ابزارهای اداری سه رکن این شغل است.",b:"منشی چهره اول هر مجموعه است.\n## وظایف رایج\n- پاسخ‌گویی به تلفن و پذیرش مراجعان\n- نوبت‌دهی و تنظیم برنامه مدیر\n- مکاتبات، بایگانی و تایپ\n## مهارت‌های لازم\n- تایپ سریع و صحیح فارسی\n- کار با ورد و اکسل\n- ادب و آرامش در برخورد\n- رازداری\nدر مصاحبه نشان بدهید چطور چند کار را هم‌زمان مدیریت می‌کنید."},

{id:"job-nurse-aide",c:"مشاغل",t:"کمک‌پرستار و مراقب؛ شرایط و نکات ورود",s:"این شغل علاوه بر مهارت، صبوری و همدلی می‌خواهد.",b:"مراقبت از بیمار و سالمند مسئولیت زیادی دارد.\n## مهارت‌ها\n- رعایت بهداشت و ایمنی\n- صبر و همدلی\n- توانایی بدنی مناسب\n- پایبندی به دستورهای پزشک و پرستار\n## توصیه‌ها\nدوره‌های آموزشی معتبر بگذرانید و گواهی‌اش را در رزومه بنویسید. تجربه مراقبت از اعضای خانواده هم قابل‌ذکر است. شیفت شب و کار تعطیلات را قبل از قبول کردن بپرسید."},

{id:"job-cook",c:"مشاغل",t:"کار در آشپزخانه؛ کمک‌آشپز تا سرآشپز",s:"بیشتر آشپزها از کمک‌آشپزی شروع کرده‌اند.",b:"آشپزخانه جایی برای یادگرفتن و رشد است.\n## مهارت‌ها\n- بهداشت و آماده‌سازی مواد\n- کار تحت فشار در ساعت شلوغی\n- هماهنگی با تیم\n- یادگیری سریع دستورها\n## چه چیزی در رزومه بنویسیم؟\nنوع غذاها، مدت کار، نوع شیفت و دوره‌ها. اگر طعم یا کیفیتی را مدیریت کرده‌اید حتماً بنویسید. برای شروع، وقت‌شناسی و انضباط از مهارت فنی هم مهم‌تر است."},

{id:"job-driver",c:"مشاغل",t:"راننده و پیک؛ نکته‌هایی که کارفرما می‌پرسد",s:"علاوه بر گواهینامه، سابقه رانندگی تمیز و مسئولیت‌پذیری مهم است.",b:"رانندگی حرفه‌ای فقط بلد بودن فرمان نیست.\n## مدارک و مهارت‌ها\n- گواهینامه معتبر متناسب با وسیله\n- آشنایی با مسیرها و راه‌یابی\n- رعایت قوانین و ایمنی\n- تحویل به‌موقع و رفتار مناسب با مشتری\n## نکته\nقبل از شروع، درباره بیمه، هزینه سوخت و تعمیرات و نحوه پرداخت حقوق شفاف توافق کنید."},

{id:"job-technician",c:"مشاغل",t:"برقکار، تأسیسات و کارهای فنی",s:"کار فنی با مهارت و ایمنی ارزش دارد.",b:"مشاغل فنی همیشه نیاز دارند.\n## مسیر یادگیری\n- دوره‌های فنی‌وحرفه‌ای معتبر\n- کار به‌عنوان شاگرد کنار استادکار\n- یادگیری اصول ایمنی\n## در رزومه\nنوع کارهای انجام‌شده، ابزارهایی که می‌شناسید و گواهی‌ها را بنویسید. نمونه کار (عکس پروژه) در مصاحبه بسیار موثر است. رعایت ایمنی را همیشه جدی بگیرید."},

{id:"job-teacher",c:"مشاغل",t:"مربی و معلم خصوصی؛ شروع کار آموزشی",s:"اگر در درسی مسلط هستید، تدریس راهی برای کار و رشد است.",b:"تدریس فقط دانش نیست، ارتباط با شاگرد هم هست.\n## مراحل شروع\n- موضوع و سطح مشخص انتخاب کنید\n- برای جلسه اول طرح درس بسازید\n- نمونه مدارک و تجربه را آماده کنید\n- با والدین یا شاگرد درباره ساعت و هزینه شفاف صحبت کنید\n## نکته\nپیشرفت شاگرد را یادداشت و گزارش دهید. بازخورد خوب بهترین تبلیغ شماست."},

{id:"job-office-clerk",c:"مشاغل",t:"کارمند اداری؛ مهارت‌هایی که همیشه مورد نیاز است",s:"مهارت‌های اداری در بیشتر مجموعه‌ها کاربرد دارند.",b:"کارمند اداری ستون فعالیت روزانه هر مجموعه است.\n## مهارت‌های کلیدی\n- ورد، اکسل و ایمیل\n- مکاتبات و بایگانی\n- نظم و دقت\n- پیگیری امور و ارتباط با بخش‌های دیگر\n## رشد\nبا یادگیری مهارت‌های بیشتر (حسابداری پایه، زبان، پایگاه داده) می‌توانید به مسئول واحد یا کارشناس ارتقا بگیرید."},

{id:"job-factory",c:"مشاغل",t:"کار در کارخانه و تولید؛ چه باید بدانیم؟",s:"ایمنی و نظم مهم‌ترین اصول کار در خط تولید است.",b:"در کارخانه، تیم و زمان بسیار اهمیت دارد.\n## موارد مهم\n- پایبندی به قوانین ایمنی و پوشش کار\n- شیفت‌بندی و اضافه‌کاری\n- دقت در کار با دستگاه\n- گزارش به‌موقع مشکلات\n## قبل از قبول کار بپرسید\nنوع شیفت، بیمه، سرویس، مزایا و دوره آزمایشی. پرسیدن این موارد نشانه جدی‌بودن شماست."},

{id:"job-cashier",c:"مشاغل",t:"صندوق‌دار؛ دقت و سرعت در کنار هم",s:"صندوق‌داری شغلی است که اشتباه کوچکش هم دیده می‌شود.",b:"صندوق‌دار به حساب و مشتری باید توجه همزمان داشته باشد.\n## مهارت‌ها\n- محاسبه سریع و دقیق\n- کار با دستگاه کارتخوان و نرم‌افزار فروش\n- برخورد خوشرو با مشتری\n- صداقت و امانت‌داری\n## نکته\nپایان هر شیفت تراز صندوق را بررسی کنید و هر اختلاف را بلافاصله گزارش بدهید."},

{id:"job-marketer",c:"مشاغل",t:"بازاریاب و ویزیتور؛ فروش بدون فشار",s:"بازاریاب موفق اعتماد می‌سازد، نه فشار.",b:"در بازاریابی ارتباط انسانی مهم‌ترین ابزار است.\n## مهارت‌ها\n- گوش دادن به نیاز مشتری\n- معرفی ساده و واضح محصول\n- پیگیری منظم\n- تحمل جواب منفی\n## نکته‌ها\nقبل از شروع، درباره حقوق ثابت، پورسانت و نحوه پرداخت توافق شفاف داشته باشید. هر شرطی را مکتوب کنید."},

{id:"job-warehouse",c:"مشاغل",t:"کار در انبار؛ نظم و ایمنی",s:"انبارداری به دقت و نظم نیاز دارد.",b:"کارگر یا مسئول انبار دو کار مهم دارد: نظم و ثبت درست.\n## وظایف\n- دریافت و تحویل کالا\n- چیدمان و شمارش\n- ثبت ورود و خروج\n- رعایت ایمنی بلندکردن بار\n## مهارت‌های مفید\nاکسل ساده، آشنایی با نرم‌افزار انبار و توانایی بدنی مناسب. دقت در ثبت‌ها از تجربه‌تان بیشتر ارزش دارد."},

{id:"job-designer",c:"مشاغل",t:"طراحی گرافیک؛ نمونه‌کار مهم‌تر از مدرک",s:"در طراحی، کار شما سخنگوی شماست.",b:"برای ورود به طراحی، نمونه‌کار لازم است.\n## مسیر پیشنهادی\n- یادگیری یکی از نرم‌افزارهای رایج طراحی\n- ساختن ۵ تا ۱۰ نمونه کار واقعی یا تمرینی\n- انتشار آن‌ها در یک صفحه ساده\n- گرفتن بازخورد از طراحان باتجربه\n## در مصاحبه\nنمونه‌ها را با توضیح هدف، مخاطب و روند کار نشان بدهید."},

{id:"job-programmer",c:"مشاغل",t:"برنامه‌نویس مبتدی؛ از کجا شروع کنیم؟",s:"با پروژه کوچک و ادامه دادن می‌شود وارد این مسیر شد.",b:"برنامه‌نویسی با تمرین یاد گرفته می‌شود.\n## مسیر\n- یک زبان را انتخاب کنید و پایه‌ها را کامل بخوانید\n- پروژه‌های کوچک بسازید: ماشین‌حساب، فهرست کارها، سایت ساده\n- کدها را در یک مخزن عمومی منتشر کنید\n- مسائل را حل کنید و کد بخوانید\n## نکته\nبیشتر کارفرماها پروژه‌های واقعی شما را می‌خواهند؛ مدرک به‌تنهایی کافی نیست."},

{id:"job-social",c:"مشاغل",t:"مدیریت شبکه‌های اجتماعی؛ شغلی با رشد بالا",s:"کسب‌وکارهای زیادی به محتوا و مدیریت صفحه نیاز دارند.",b:"مدیر شبکه اجتماعی فقط پست نمی‌گذارد؛ برای هدف تولید محتوا می‌کند.\n## مهارت‌ها\n- نوشتن کپشن و ایده محتوا\n- ویرایش ساده تصویر و ویدیو\n- شناخت مخاطب و تحلیل آمار صفحه\n- برنامه‌ریزی تقویم محتوا\n## شروع\nیک صفحه نمونه بسازید یا برای کسب‌وکار آشنایان کار کنید و نتیجه را (رشد دنبال‌کننده، تعامل) به‌عنوان نمونه ارائه دهید."},

{id:"job-clinic",c:"مشاغل",t:"پذیرش و منشی مطب یا کلینیک",s:"برخورد آرام و دقت در اطلاعات بیماران اهمیت زیادی دارد.",b:"پذیرش اولین نقطه تماس بیمار است.\n## وظایف\n- نوبت‌دهی و ثبت اطلاعات\n- پاسخ تلفنی و راهنمایی مراجعان\n- هماهنگی با پزشک و بخش‌ها\n## مهارت‌ها\nرازداری، تایپ و کار با نرم‌افزار نوبت‌دهی، صبر و مهارت ارتباطی. هرگز اطلاعات بیماران را بیرون از محیط کار بازگو نکنید."},

{id:"job-bakery",c:"مشاغل",t:"نانوایی، شیرینی‌پزی و قنادی",s:"مشاغل غذایی با علاقه و بهداشت رشد می‌کنند.",b:"این حوزه هم شیفت صبح زود دارد و هم دقت زیاد.\n## مهارت‌ها\n- رعایت بهداشت و دستورها\n- زمان‌بندی دقیق پخت\n- هماهنگی در تیم\n- ذوق و خلاقیت در طعم و ظاهر\n## شروع\nاز شاگردی شروع کنید و ثبات داشته باشید. دوره‌های آموزشی و نمونه‌کار (عکس محصول) به شما در پیدا کردن فرصت بهتر کمک می‌کند."},

{id:"job-security",c:"مشاغل",t:"نگهبانی و حراست؛ مسئولیت و هوشیاری",s:"این کار نیازمند هوشیاری، نظم و پایبندی به قوانین است.",b:"نگهبان نقش مهمی در امنیت مجموعه دارد.\n## ویژگی‌های مهم\n- وقت‌شناسی و کار در شیفت‌های مختلف\n- رفتار محترمانه ولی قاطع\n- ثبت دقیق ورود و خروج\n- گزارش به‌موقع هر مورد مشکوک\n## توصیه\nقبل از قبول، درباره شیفت، بیمه و مزایا توافق کنید. دقت در جزئیات و صداقت شما را ماندگار می‌کند."},

{id:"resume-template",c:"رزومه",t:"انتخاب قالب مناسب رزومه",s:"قالب ساده و خوانا بهتر از قالب شلوغ و رنگارنگ است.",b:"قالب رزومه باید به محتوا کمک کند، نه حواس را پرت.\n## چه قالبی بهتر است؟\n- یک ستونه و ساده برای ارسال آنلاین\n- فونت خوانا و اندازه مناسب\n- رنگ کم و ملایم\n- فاصله‌گذاری منظم بین بخش‌ها\n## نکته\nقالب‌های دوستونه و خلاقانه برای طراحی یا هنر مناسب‌ترند. برای اغلب شغل‌های اداری و خدماتی، قالب کلاسیک یا مینیمال انتخاب امن‌تری است."},

{id:"resume-photo",c:"رزومه",t:"عکس رزومه؛ بگذاریم یا نه؟",s:"اگر آگهی عکس نخواسته، نگذاشتن آن مشکلی ندارد. اگر گذاشتید باید مناسب باشد.",b:"در بعضی آگهی‌ها عکس خواسته می‌شود و در بعضی خیر.\n## اگر عکس می‌گذارید\n- عکس پرسنلی، واضح و با زمینه ساده\n- لباس مرتب و حالت رسمی\n- بدون فیلتر، سلفی یا عکس دسته‌جمعی\n- حدود یک‌چهارم صفحه یا کوچک‌تر\n## یادآوری\nمهم‌ترین بخش رزومه تجربه و مهارت شماست؛ عکس نباید جای آن را بگیرد."},

{id:"resume-english",c:"رزومه",t:"رزومه انگلیسی؛ چه زمانی لازم است؟",s:"برای مجموعه‌های بین‌المللی یا دورکاری خارجی رزومه انگلیسی لازم می‌شود.",b:"اگر آگهی انگلیسی است یا با خارج از کشور کار می‌کنید، رزومه انگلیسی بسازید.\n## نکته‌ها\n- ترجمه ماشینی را حتماً بازبینی کنید\n- جمله‌ها کوتاه و با فعل‌های عملی شروع شوند\n- تاریخ‌ها را به میلادی بنویسید\n- فقط تجربه‌ها و مهارت‌های مرتبط را بیاورید\n## کمک\nاز فردی که انگلیسی‌اش خوب است بخواهید متن را بخواند تا غلط املایی و نگارشی نداشته باشد."},

{id:"resume-student",c:"رزومه",t:"رزومه دانشجو و تازه‌فارغ‌التحصیل",s:"حتی بدون سابقه کاری هم می‌توانید رزومه قوی بسازید.",b:"وقتی سابقه کاری کم است، تحصیلات و فعالیت‌ها وزن بیشتری می‌گیرند.\n## چه چیزهایی بنویسیم؟\n- رشته، دانشگاه و معدل (اگر خوب است)\n- پروژه‌های درسی و پایان‌نامه\n- کارآموزی و دوره‌های آموزشی\n- فعالیت‌های داوطلبانه و عضویت در انجمن‌ها\n- مهارت‌های نرم‌افزاری و زبان\n## ترتیب\nتحصیلات و پروژه‌ها را بالاتر از سوابق کاری بیاورید و رزومه را یک صفحه نگه دارید."},

{id:"resume-change-career",c:"رزومه",t:"رزومه برای تغییر مسیر شغلی",s:"وقتی می‌خواهید حوزه کاری را عوض کنید، مهارت‌های قابل‌انتقال را برجسته کنید.",b:"تغییر شغل یعنی نشان دادن اینکه تجربه قبلی به کار جدید کمک می‌کند.\n## مهارت‌های قابل‌انتقال\n- ارتباط با مشتری\n- مدیریت زمان و کار تیمی\n- حل مسئله و مسئولیت‌پذیری\n- کار با نرم‌افزارهای رایج\n## توصیه‌ها\nدر خلاصه رزومه بگویید به کدام مسیر علاقه دارید و چرا. دوره‌های جدید را بنویسید و نشان بدهید برای مسیر جدید قدم برداشته‌اید."},

{id:"resume-update",c:"رزومه",t:"هر چند وقت یک بار رزومه را به‌روز کنیم؟",s:"رزومه مثل پروفایل زنده است و نباید سال‌ها دست‌نخورده بماند.",b:"بهترین زمان به‌روزرسانی، همان موقعی است که اتفاق می‌افتد.\n## چه زمانی؟\n- بعد از پایان یک پروژه یا دوره\n- با هر مهارت و گواهی جدید\n- پس از تغییر شغل یا ارتقا\n- حداقل هر سه ماه یک بار مرور کلی\n## کار ساده\nیک فایل یادداشت داشته باشید و دستاوردها را همان لحظه در آن بنویسید. موقع نوشتن رزومه جدید فراموش نمی‌کنید."},

{id:"resume-references",c:"رزومه",t:"معرف و تماس مرجع؛ چطور استفاده کنیم؟",s:"وجود یک معرف خوب می‌تواند اعتماد کارفرما را بالا ببرد.",b:"معرف کسی است که کارفرما می‌تواند درباره شما از او بپرسد.\n## نکات\n- قبل از معرفی کردن، از خود فرد اجازه بگیرید\n- کسی را انتخاب کنید که کار شما را دیده (مدیر قبلی، استاد)\n- اطلاعات تماس درست بدهید\n- معرف را از آگهی و موقعیت شغلی مطلع کنید\n## یادآوری\nمعمولاً لازم نیست نام معرف در رزومه بیاید؛ می‌توانید بنویسید «اطلاعات معرف در صورت درخواست ارائه می‌شود»."},

{id:"resume-send",c:"رزومه",t:"ارسال رزومه با ایمیل، پیام‌رسان یا حضوری",s:"روش ارسال هم بخشی از تصویر حرفه‌ای شماست.",b:"نحوه ارسال به نوع مجموعه بستگی دارد.\n## ایمیل\n- موضوع و متن کوتاه بنویسید\n- فایل را با نام مناسب پیوست کنید\n- از امضای ساده و راه تماس استفاده کنید\n## پیام‌رسان\n- مودب و کوتاه پیام بدهید\n- رزومه را به‌صورت فایل بفرستید، نه عکس\n## حضوری\nنسخه چاپی مرتب، داخل پوشه یا نایلون تمیز تحویل بدهید. در همه حالت‌ها، قبل از ارسال، آگهی را دوباره بخوانید."},

{id:"interview-dress",c:"مصاحبه",t:"لباس مصاحبه؛ چه بپوشیم؟",s:"پوشش مناسب نشانه احترام به مجموعه است.",b:"قانون ساده این است که کمی رسمی‌تر از لباس معمول همان محیط بپوشید.\n## نکته‌ها\n- لباس تمیز، اتوکرده و متناسب با فصل\n- پوشش ساده و بدون اغراق\n- کفش مرتب\n- عطر و آرایش ملایم\n- پرهیز از لباس با شعار یا تصویر\n## برای مشاغل خاص\nدر کارهای فنی و کارگاهی، لباس مرتب و راحت کافی است. برای مشاغل اداری و بانکی، رسمی‌تر بپوشید."},

{id:"interview-retail",c:"مصاحبه",t:"مصاحبه برای فروشگاه و کار شیفتی",s:"در این مصاحبه‌ها معمولاً از رفتار و آمادگی کاری سوال می‌شود.",b:"سوال‌های رایج این مصاحبه‌ها ساده‌اند، اما آمادگی لازم دارند.\n## چه می‌پرسند؟\n- آیا می‌توانید در شیفت‌های مختلف کار کنید؟\n- چطور با مشتری ناراضی برخورد می‌کنید؟\n- چند وقت می‌توانید در مجموعه بمانید؟\n- چه زمانی می‌توانید شروع کنید؟\n## چه کنیم؟\nصادق و مشخص جواب بدهید و مثال بزنید. اگر محدودیتی دارید (ساعت یا مسافت)، از همان ابتدا مطرح کنید."},

{id:"interview-star",c:"مصاحبه",t:"روش STAR برای پاسخ به سوال‌های تجربی",s:"با یک ساختار ساده، جواب‌هایتان منظم و قانع‌کننده می‌شود.",b:"سوال‌هایی مثل «یک مشکل کاری را که حل کردید تعریف کنید» با ساختار STAR خوب جواب داده می‌شود.\n## چهار بخش\n- موقعیت: چه اتفاقی افتاده بود؟\n- وظیفه: مسئولیت شما چه بود؟\n- اقدام: دقیقاً چه کاری کردید؟\n- نتیجه: چه اتفاقی افتاد و چه آموختید؟\n## نکته\nقبل از مصاحبه دو یا سه خاطره کاری مثبت آماده کنید و بر اساس این چهار قدم تمرین کنید. جواب را بیش از دو دقیقه نکنید."},

{id:"interview-group",c:"مصاحبه",t:"مصاحبه گروهی؛ چطور دیده شویم؟",s:"در مصاحبه گروهی، رفتار شما با دیگران هم سنجیده می‌شود.",b:"چند نفر با هم برای یک موقعیت ارزیابی می‌شوند.\n## توصیه‌ها\n- گوش بدهید و حرف دیگران را قطع نکنید\n- نظر خودتان را کوتاه و واضح بگویید\n- به نظر دیگران احترام بگذارید و در صورت لزوم از آن‌ها حمایت کنید\n- اگر کار گروهی دادند، تقسیم وظیفه را پیشنهاد دهید\n## اشتباه رایج\nبیش از حد مطرح شدن یا سکوت کامل. تعادل بین این دو مهم است."},

{id:"interview-manager",c:"مصاحبه",t:"مصاحبه با مدیر؛ رفتار و انتظارها",s:"مدیر دنبال کسی است که بتواند با او کار کند و به او اعتماد داشته باشد.",b:"در مصاحبه با مدیر، علاوه بر مهارت، تناسب با تیم بررسی می‌شود.\n## چه کار کنیم؟\n- درباره دستاوردها با اعتماد و بدون اغراق صحبت کنید\n- نشان بدهید به یادگیری و بازخورد علاقه دارید\n- درباره اهداف مجموعه و نقش خودتان سوال بپرسید\n- در مورد کار تیمی مثال واقعی بیاورید\n## یادآوری\nمدیرها صداقت را از اغراق تشخیص می‌دهند. اگر جواب سوالی را نمی‌دانید، صادقانه بگویید و بگویید چطور یاد می‌گیرید."},

{id:"interview-followup",c:"مصاحبه",t:"پیگیری بعد از مصاحبه؛ چه زمانی و چگونه؟",s:"یک پیام کوتاه و مودبانه نشان‌دهنده علاقه شماست.",b:"بعد از مصاحبه، سکوت کامل کار درستی نیست.\n## پیشنهاد\n- همان روز یا فردا یک پیام کوتاه تشکر بفرستید\n- اگر زمان اعلام نتیجه گفته شد، پیش از آن پیگیری نکنید\n- اگر بعد از موعد خبری نشد، یک بار مودبانه سوال کنید\n## نمونه پیام\n«سلام و احترام. از وقتی که برای مصاحبه گذاشتید سپاسگزارم. علاقه‌مندم برای این موقعیت همکاری کنم و منتظر خبر شما هستم.»\nدر پیام‌ها اصرار نکنید و تعدادش را زیاد نکنید."},

{id:"interview-past-salary",c:"مصاحبه",t:"وقتی درباره حقوق قبلی می‌پرسند",s:"جواب صادقانه و آرام بدهید و تمرکز را روی ارزش خودتان ببرید.",b:"این سوال برای خیلی‌ها ناراحت‌کننده است.\n## توصیه‌ها\n- دروغ نگویید؛ ممکن است بعداً بررسی شود\n- بگویید حقوق قبلی بر اساس شرایط همان مجموعه بوده و حالا بر اساس مهارت‌های فعلی انتظار دارید\n- بازه‌ای معقول از حقوق مورد انتظار را بگویید\n## نمونه\n«حقوق قبلی من در همان محدوده بود، اما با توجه به مسئولیت‌هایی که اینجا دارم و مهارت‌هایی که اضافه کرده‌ام، انتظارم در بازه فلان است.»"},

{id:"interview-practical-test",c:"مصاحبه",t:"آزمون عملی در مصاحبه",s:"بعضی مشاغل برای سنجش مهارت، آزمون عملی می‌گیرند.",b:"در مشاغلی مثل تایپ، آشپزی، حسابداری و فنی، ممکن است مهارت را مستقیم بسنجند.\n## آمادگی\n- مهارت‌های پایه را قبل از مصاحبه مرور کنید\n- ابزار شخصی مورد نیاز را همراه ببرید\n- دستورالعمل را با دقت بخوانید\n- سرعت و کیفیت را متعادل نگه دارید\n## هنگام آزمون\nاگر سوالی دارید، بپرسید. خطا طبیعی است؛ مهم این است که آرامش خود را حفظ کنید و کار را با دقت ادامه دهید."},

{id:"exam-resources",c:"استخدامی",t:"منبع درست برای آزمون استخدامی چیست؟",s:"منبع زیاد خواندن لزوماً بهتر نیست؛ منبع مناسب و تکرار مهم‌تر است.",b:"انتخاب منبع کمک می‌کند وقتتان هدر نرود.\n## چه کنیم؟\n- فهرست منابع را از آگهی یا دفترچه آزمون بگیرید\n- از هر درس یک منبع اصلی انتخاب کنید\n- به‌جای تعداد منبع، تعداد دفعات مرور را بالا ببرید\n- نمونه سوال سال‌های قبل را حتماً حل کنید\n## هشدار\nبرای تهیه منابع پولی عجله نکنید و ابتدا نمونه رایگان و معتبر را بررسی کنید."},

{id:"exam-intelligence",c:"استخدامی",t:"درس هوش و استعداد تحلیلی؛ چطور تقویت کنیم؟",s:"با تمرین و شناخت الگوها می‌شود سرعت و دقت را بالا برد.",b:"سوال‌های هوش و استعداد معمولاً الگو، منطق و استدلال می‌سنجند.\n## تمرین‌ها\n- حل مسئله‌های الگو و دنباله‌ها\n- تمرین استدلال منطقی و قیاس\n- حل تست‌های زمان‌دار\n- مرور اشتباه‌ها و یافتن الگوی خطا\n## نکته\nدر این درس تمرین روزانه کوتاه از مطالعه طولانی و گاهی مفیدتر است. می‌توانید از آزمون‌های همین اپ برای تمرین استفاده کنید."},

{id:"exam-math",c:"استخدامی",t:"ریاضی آزمون استخدامی؛ مباحث پرتکرار",s:"با تمرکز روی مباحث پایه، بخش بزرگی از سوال‌ها قابل پاسخ است.",b:"ریاضی آزمون‌ها معمولاً در سطح پایه است ولی زمان کم می‌شود.\n## مباحث پرتکرار\n- درصد، نسبت و تناسب\n- سرعت، زمان و مسافت\n- کار و زمان\n- جبر ساده و معادله\n- الگوهای عددی\n## تمرین\nروش‌های سریع محاسبه را یاد بگیرید و جدول‌های ضرب و درصد را از حفظ کنید. بعد از هر تمرین، راه‌حل‌های کوتاه‌تر را یادداشت کنید."},

{id:"exam-persian",c:"استخدامی",t:"ادبیات فارسی؛ از کجا شروع کنیم؟",s:"با مرور قواعد و تمرین نمونه سوال، این درس پربازده است.",b:"این درس برای بسیاری از آزمون‌ها ضریب خوبی دارد.\n## مباحث رایج\n- املا و درست‌نویسی\n- دستور زبان و واژگان\n- آرایه‌های ادبی\n- تاریخ ادبیات\n- معنی شعر و نثر\n## روش مطالعه\nجمع‌بندی هر مبحث را در برگه‌های کوچک بنویسید و هر روز مرور کنید. تست‌های سال‌های قبل بهترین نمونه برای شناخت سبک سوال هستند."},

{id:"exam-english",c:"استخدامی",t:"زبان انگلیسی عمومی در آزمون‌ها",s:"با واژگان پایه و تمرین درک مطلب، نمره خوبی ممکن است.",b:"سوال‌های انگلیسی آزمون‌ها معمولاً در چند بخش‌اند.\n## بخش‌ها\n- واژگان\n- گرامر\n- درک مطلب\n- تکمیل جمله\n## نکته‌ها\n- هر روز ۱۰ تا ۲۰ لغت یاد بگیرید\n- گرامر پایه را مرور کنید\n- متن‌های کوتاه بخوانید و سوال‌هایشان را حل کنید\nبرای درک مطلب، اول سوال‌ها را بخوانید و بعد متن را با هدف جواب‌دادن مرور کنید."},

{id:"exam-test-tricks",c:"استخدامی",t:"فنون تست‌زنی؛ صحیح‌ترین گزینه را چطور پیدا کنیم؟",s:"کمی تکنیک، سرعت و دقت شما را بالا می‌برد.",b:"تست‌زنی مهارتی است که با تمرین بهتر می‌شود.\n## فنون مفید\n- ابتدا سوال را کامل بخوانید\n- گزینه‌های بی‌ربط را حذف کنید\n- به کلمه‌هایی مثل «همواره»، «هرگز» و «به‌جز» دقت کنید\n- گزینه‌های مشابه را با هم مقایسه کنید\n- اگر مطمئن نیستید، با حذف گزینه‌ها تصمیم بگیرید\n## یادآوری\nتکنیک جای مطالعه را نمی‌گیرد؛ فقط به بهتر استفاده کردن از دانش شما کمک می‌کند."},

{id:"exam-mock",c:"استخدامی",t:"آزمون آزمایشی؛ چرا و چطور؟",s:"آزمون آزمایشی شما را با فضای واقعی آزمون آشنا می‌کند.",b:"بهترین راه سنجش آمادگی، شبیه‌سازی آزمون واقعی است.\n## چطور انجام دهیم؟\n- در شرایط واقعی و با زمان کامل بنشینید\n- موبایل و منابع را کنار بگذارید\n- بعد از آزمون، پاسخ‌ها را بررسی کنید\n- نقاط ضعف را در برنامه هفته بعد بگذارید\n## نکته\nهر دو هفته یک آزمون جامع بزنید. روند نمره را ثبت کنید تا پیشرفتتان را ببینید."},

{id:"exam-review",c:"استخدامی",t:"جمع‌بندی و مرور در هفته آخر",s:"آخرین هفته برای تثبیت است، نه یادگیری مطالب جدید.",b:"در هفته پایانی، مطالعه جدید را کنار بگذارید.\n## برنامه پیشنهادی\n- مرور خلاصه‌ها و یادداشت اشتباه‌ها\n- حل چند آزمون جامع\n- مرور فرمول‌ها و واژگان\n- خواب منظم و تغذیه مناسب\n## شب قبل\nمدارک و وسایل را آماده کنید و زود بخوابید. سعی کنید ذهنتان را آرام نگه دارید."},

{id:"exam-registration",c:"استخدامی",t:"ثبت‌نام آزمون؛ نکته‌های دقت",s:"یک اشتباه ساده در ثبت‌نام می‌تواند فرصت را از بین ببرد.",b:"قبل از ثبت‌نام، شرایط را با دقت بخوانید.\n## موارد مهم\n- شرایط سنی، تحصیلی و سایر شرایط آگهی\n- مهلت و روش ثبت‌نام\n- مدارک و عکس موردنیاز\n- اطلاعات شخصی را دقیق و مطابق مدارک وارد کنید\n## توصیه‌ها\n- فقط از درگاه رسمی ثبت‌نام کنید\n- شماره پیگیری و رسید را نگه دارید\n- پیش از آخرین روز مهلت اقدام کنید\nدر صورت ابهام، از مرجع رسمی همان آزمون سوال کنید."},

{id:"exam-job-choice",c:"استخدامی",t:"انتخاب شغل در آزمون؛ چطور تصمیم بگیریم؟",s:"انتخاب درست، شانس قبولی و رضایت بعد از استخدام را بالا می‌برد.",b:"گاهی چند شغل یا رشته برای انتخاب وجود دارد.\n## معیارها\n- ارتباط با رشته و مهارت شما\n- محل خدمت و تردد\n- ظرفیت و رقابت\n- شرایط کاری و رشد\n## توصیه\nدفترچه آزمون را کامل بخوانید و اولویت‌ها را بنویسید. با افرادی که در همان حوزه کار می‌کنند صحبت کنید و واقع‌بینانه تصمیم بگیرید."},

{id:"exam-fail",c:"استخدامی",t:"اگر در آزمون قبول نشدیم، بعد چه کنیم؟",s:"هر آزمون تجربه‌ای برای دوره بعد است.",b:"نتیجه منفی پایان مسیر نیست.\n## قدم‌ها\n- نتیجه و کارنامه را بررسی کنید\n- ضعیف‌ترین درس‌ها را مشخص کنید\n- برنامه جدید با زمان‌بندی بنویسید\n- روش مطالعه را اصلاح کنید\n- با افراد موفق و باتجربه مشورت کنید\n## یادآوری\nبسیاری از پذیرفته‌شدگان بار اول قبول نشده‌اند. ثبات و اصلاح روش مهم‌ترین عامل است."},

{id:"exam-docs",c:"استخدامی",t:"مدارکی که برای آزمون و گزینش آماده کنیم",s:"آماده‌بودن مدارک از تأخیر و استرس جلوگیری می‌کند.",b:"فهرست دقیق را همیشه از آگهی همان آزمون بگیرید. معمولاً چند مدرک پایه لازم می‌شود.\n## نمونه موارد رایج\n- شناسنامه و کارت ملی\n- مدرک تحصیلی و ریز نمرات\n- عکس پرسنلی\n- مدارک وضعیت خدمت یا معافیت (در صورت لزوم)\n- مدارک سوابق کاری یا دوره‌ها\n## توصیه\nاز همه مدارک نسخه اسکن و چاپی نگه دارید و آن‌ها را در یک پوشه منظم کنید."},

{id:"internship",c:"کارجو",t:"کارآموزی؛ پلی به اولین کار",s:"کارآموزی فرصتی برای یادگرفتن و ساختن رزومه است.",b:"کارآموزی حتی بدون حقوق زیاد، تجربه ارزشمندی می‌دهد.\n## نکته‌ها\n- محل کارآموزی مرتبط با علاقه‌تان انتخاب کنید\n- هدف مشخص برای یادگیری بنویسید\n- وظایف و گواهی پایان دوره را مستند کنید\n- ارتباط خوبی با همکاران بسازید\nبسیاری از کارآموزان به‌دلیل رفتار و علاقه خوب، همان‌جا استخدام می‌شوند."},

{id:"remote-work",c:"کارجو",t:"دورکاری؛ مزایا، چالش‌ها و شروع",s:"دورکاری آزادی می‌دهد ولی انضباط شخصی می‌خواهد.",b:"بسیاری از مشاغل امروز امکان دورکاری دارند.\n## مزایا\n- صرفه‌جویی در رفت‌وآمد\n- انعطاف زمانی\n- دسترسی به فرصت‌های بیشتر\n## چالش‌ها\n- نیاز به نظم و برنامه\n- تنهایی و کمبود تعامل\n- لازم بودن اینترنت و ابزار مناسب\n## شروع\nفضایی ثابت برای کار درست کنید، ساعت کاری مشخص بگذارید و با کارفرما درباره روش گزارش و ارتباط توافق کنید."},

{id:"freelance",c:"کارجو",t:"فریلنسری؛ شروع کار مستقل",s:"اگر مهارت دارید، می‌توانید مستقل کار کنید.",b:"در فریلنسری خودتان مدیر کار هستید.\n## مراحل\n- مهارتی را که بازار دارد انتخاب کنید\n- نمونه‌کار آماده کنید\n- قیمت منصفانه تعیین کنید\n- قرارداد یا توافق مکتوب داشته باشید\n- پیش‌پرداخت بگیرید\n## هشدار\nقبل از شروع هر پروژه، موضوع، زمان تحویل و شرایط پرداخت را شفاف کنید تا اختلاف پیش نیاید."},

{id:"part-time",c:"کارجو",t:"کار پاره‌وقت؛ انتخاب درست",s:"کار پاره‌وقت می‌تواند هم درآمد و هم تجربه باشد.",b:"برای دانشجو، مادر یا کسی که زمان محدود دارد، مناسب است.\n## نکات\n- ساعت کار را با برنامه خود هماهنگ کنید\n- مسیر رفت‌وآمد را حساب کنید\n- درباره نحوه پرداخت و روزهای کاری قبل از شروع توافق کنید\n- اگر در آینده به کار تمام‌وقت می‌اندیشید، تجربه‌ای انتخاب کنید که در رزومه ارزش داشته باشد"},

{id:"student-job",c:"کارجو",t:"کار در کنار تحصیل",s:"با برنامه‌ریزی می‌شود هم درس خواند و هم کار کرد.",b:"تعادل بین درس و کار سخت است ولی شدنی.\n## توصیه‌ها\n- کارهای انعطاف‌پذیر و پاره‌وقت را انتخاب کنید\n- برنامه امتحانات را با کارفرما در میان بگذارید\n- خواب و استراحت را فدا نکنید\n- از کار برای ساختن مهارت‌های مرتبط با رشته استفاده کنید\nتجربه کار در دوران دانشجویی در رزومه بعدی بسیار ارزشمند است."},

{id:"change-job",c:"کارجو",t:"چه زمانی وقت تغییر شغل است؟",s:"تغییر شغل تصمیمی مهم است و باید حساب‌شده باشد.",b:"گاهی ماندن و گاهی رفتن درست است.\n## نشانه‌هایی که شاید وقت تغییر است\n- نبود فرصت یادگیری و رشد\n- حقوق یا شرایط ناعادلانه و ثابت\n- محیط کاری آسیب‌زننده\n## قبل از رفتن\n- ابتدا با مدیر درباره مشکل صحبت کنید\n- شغل جدید را مطمئن پیدا کنید\n- با آرامش استعفا بدهید\nتغییر شغل بدون برنامه، می‌تواند استرس مالی ایجاد کند."},

{id:"goal-setting",c:"کارجو",t:"هدف‌گذاری شغلی برای کارجوها",s:"بدون هدف، هر آگهی شبیه هر آگهی دیگر است.",b:"هدف مشخص انتخاب را ساده می‌کند.\n## چطور هدف بنویسیم؟\n- شغل مورد نظر در ۱ تا ۳ سال آینده\n- مهارت‌های لازم و شکاف‌ها\n- برنامه یادگیری ماهانه\n- فهرست مجموعه‌هایی که دوست دارید\n## نکته\nهدف را کوچک و قابل‌اندازه‌گیری بنویسید؛ مثل «تا آخر ماه اکسل را کامل یاد بگیرم» و نه «موفق شوم»."},

{id:"job-ad-reading",c:"کارجو",t:"چطور آگهی شغلی را درست بخوانیم؟",s:"با خواندن دقیق آگهی، رزومه و مصاحبه بهتری آماده می‌کنید.",b:"هر آگهی اطلاعات مهمی دارد.\n## موارد مهم\n- عنوان و شرح وظایف\n- شرایط ضروری و ترجیحی\n- ساعت و محل کار\n- حقوق و مزایا (اگر ذکر شده)\n- روش ارسال رزومه\n## توصیه‌ها\nکلمه‌های کلیدی را مشخص کنید و در رزومه به آن‌ها بپردازید. اگر شرط اصلی را ندارید، بهتر است با واقع‌بینی تصمیم بگیرید."},

{id:"workplace-etiquette",c:"محیط کار",t:"آداب رفتار در محیط کار",s:"رفتار محترمانه و منظم، اولین چیزی است که همکاران می‌بینند.",b:"آداب کار باعث می‌شود محیط آرام‌تری داشته باشید.\n## نکته‌ها\n- وقت‌شناسی در ورود و جلسات\n- سلام و احترام به همه\n- بلند صحبت نکردن و پرهیز از شایعه‌پراکنی\n- مرتب نگه داشتن فضای کاری\n- استفاده بجا از موبایل\n## یادآوری\nمحیط کار جای دوست‌یابی هم هست، ولی هیچ‌وقت از اطلاعات شخصی دیگران یا اختلاف‌های داخلی بیرون صحبت نکنید."},

{id:"hard-boss",c:"محیط کار",t:"برخورد با مدیر سخت‌گیر",s:"با آرامش و مستندسازی می‌شود با این شرایط کنار آمد.",b:"سخت‌گیری با بدرفتاری فرق دارد.\n## توصیه‌ها\n- انتظارات را روشن بپرسید و یادداشت کنید\n- کارها را به‌موقع و مرتب تحویل بدهید\n- بازخورد را شخصی نگیرید\n- اگر رفتار توهین‌آمیز بود، موضوع را مؤدبانه و رسمی مطرح کنید\n- در صورت ادامه، به واحد بالاتر یا مراجع رسمی مراجعه کنید\n## یادآوری\nسلامت روان شما مهم است؛ اگر محیط به‌شدت آزاردهنده است، به‌دنبال شغل جایگزین باشید."},

{id:"work-safety",c:"محیط کار",t:"ایمنی در محیط کار",s:"ایمنی حق شماست و رعایت آن وظیفه همه است.",b:"حادثه معمولاً از بی‌توجهی شروع می‌شود.\n## اصول پایه\n- استفاده از وسایل حفاظتی مناسب\n- آشنایی با خروج اضطراری و کپسول آتش‌نشانی\n- گزارش هر خطر یا ایراد دستگاه\n- عدم استفاده از دستگاه ناآشنا\n## یادآوری\nاگر شرایط ایمن نیست، در گزارش دادن تردید نکنید. ایمنی کار با عجله و صرفه‌جویی قابل‌معامله نیست."},

{id:"professional-ethics",c:"محیط کار",t:"اخلاق حرفه‌ای؛ سرمایه‌ای که ماندگار است",s:"اعتماد، پایه هر رابطه کاری است.",b:"اخلاق حرفه‌ای نشان می‌دهد چه کسی هستید.\n## ستون‌ها\n- صداقت و امانت‌داری\n- رازداری درباره اطلاعات مجموعه\n- مسئولیت‌پذیری در برابر اشتباه\n- احترام به همکاران و مشتری\n- وفاداری به تعهدات\n## نتیجه\nکسی که به او اعتماد شود، فرصت‌های بیشتری هم می‌گیرد و حتی با تغییر محل کار، اعتبار خودش را حفظ می‌کند."},

{id:"resign-properly",c:"محیط کار",t:"استعفای درست؛ بدون ایجاد دشمنی",s:"نحوه خداحافظی، اعتبار شما را حفظ می‌کند.",b:"حتی اگر ناراضی هستید، خداحافظی مناسب مهم است.\n## مراحل\n- ابتدا با مدیر مستقیم صحبت کنید\n- استعفانامه کوتاه و مودبانه بنویسید\n- مهلت اعلام‌شده در قرارداد را رعایت کنید\n- کارهایتان را مرتب تحویل بدهید\n- تسویه‌حساب و مدارک را مکتوب بگیرید\n## یادآوری\nتا شغل جدیدتان قطعی نشده، استعفا ندهید و درباره مجموعه قبلی بدگویی نکنید."},

{id:"work-life",c:"محیط کار",t:"تعادل کار و زندگی",s:"کار مهم است ولی نباید همه زندگی شما را بگیرد.",b:"فرسودگی شغلی یکی از مشکلات رایج است.\n## توصیه‌ها\n- ساعت کار و استراحت را مشخص کنید\n- از مرخصی و تعطیلات استفاده کنید\n- فعالیت جسمی و اجتماعی را کنار نگذارید\n- همه کارها را روی دوش خودتان نیندازید\n- درباره فشار کاری با مدیر صحبت کنید\nتعادل باعث می‌شود با انگیزه و کیفیت بیشتری کار کنید."},

{id:"training-job",c:"محیط کار",t:"آموزش حین کار؛ چطور سریع‌تر یاد بگیریم؟",s:"در ماه‌های اول، یادگیری سریع بهترین سرمایه شماست.",b:"آدم‌های تازه‌وارد با روش درست زود جا می‌افتند.\n## توصیه‌ها\n- سوال‌هایتان را یادداشت کنید و جمع‌بندی بپرسید\n- روند کار را با نمودار ساده برای خودتان رسم کنید\n- از همکاران باتجربه بخواهید کار را نشان بدهند\n- در هفته اول اشتباه‌ها را بپذیرید و اصلاح کنید\n- هر هفته چند دقیقه برای مرور اختصاص بدهید"},

{id:"reporting",c:"محیط کار",t:"گزارش‌دهی کاری؛ ساده و اثرگذار",s:"گزارش خوب کوتاه، دقیق و کاربردی است.",b:"گزارش نوشتن مهارتی ارزشمند است.\n## ساختار\n- چه کاری انجام شد؟\n- چه نتیجه‌ای گرفتیم؟\n- مشکل یا مانع چه بود؟\n- گام بعدی چیست؟\n## نکته‌ها\nعدد و تاریخ بیاورید، جمله‌ها را کوتاه بنویسید و از حاشیه بپرهیزید. گزارش منظم، اعتماد مدیر را بالا می‌برد."},

{id:"english-job",c:"مهارت",t:"انگلیسی برای کار؛ چه سطحی لازم است؟",s:"در بسیاری از مشاغل، انگلیسی پایه هم مزیت بزرگی است.",b:"لازم نیست مثل زبان‌شناس باشید.\n## چه چیزهایی مفید است؟\n- خواندن ایمیل و دستورالعمل ساده\n- نوشتن پیام کوتاه حرفه‌ای\n- مکالمه ساده با مشتری یا همکار خارجی\n- آشنایی با واژگان شغل خودتان\n## راه یادگیری\nروزی ۲۰ دقیقه بخوانید و گوش بدهید. اصطلاحات رایج شغل خود را جداگانه یاد بگیرید و مکالمه‌های کوتاه را تمرین کنید."},

{id:"fast-typing",c:"مهارت",t:"تایپ سریع فارسی و انگلیسی",s:"تایپ سریع در بسیاری از مشاغل اداری کار را راحت‌تر می‌کند.",b:"تایپ مهارتی است که با تمرین بهتر می‌شود.\n## راه‌های تقویت\n- با ده‌انگشتی تایپ را یاد بگیرید\n- هر روز ۱۵ تا ۲۰ دقیقه تمرین کنید\n- اول دقت، بعد سرعت\n- از نرم‌افزارها و سایت‌های آموزش تایپ استفاده کنید\n## هدف\nسرعت مناسب برای مشاغل اداری معمولاً چند ده کلمه در دقیقه با دقت بالاست. در رزومه، نتیجه آزمون تایپ را هم می‌توانید بنویسید."},

{id:"presentation",c:"مهارت",t:"ارائه و سخنرانی کوتاه",s:"ارائه خوب یعنی پیام روشن، نه صحبت طولانی.",b:"گاهی لازم است ایده یا گزارش را جلوی دیگران ارائه دهید.\n## نکته‌ها\n- پیام اصلی را در یک جمله بنویسید\n- سه نکته مهم انتخاب کنید\n- اسلاید را ساده و کم‌متن بسازید\n- قبلاً تمرین کنید و زمان را کنترل کنید\n- با مخاطب ارتباط چشمی داشته باشید\n## یادآوری\nاگر استرس دارید، یادآوری کنید که مخاطب می‌خواهد شما موفق شوید."},

{id:"problem-solving",c:"مهارت",t:"حل مسئله؛ مهارتی که همه دنبالش‌اند",s:"کارفرما دوست دارد کسی را استخدام کند که مشکل را حل کند.",b:"حل مسئله یعنی آرام ماندن و قدم‌به‌قدم جلو رفتن.\n## مراحل ساده\n- مشکل را دقیق تعریف کنید\n- علت‌های ممکن را بنویسید\n- چند راه‌حل پیشنهاد دهید\n- بهترین را امتحان و نتیجه را بررسی کنید\n## در مصاحبه\nیک مشکل واقعی که حل کرده‌اید را با روش STAR تعریف کنید."},

{id:"confidence",c:"مهارت",t:"تقویت اعتمادبه‌نفس برای مصاحبه و کار",s:"اعتمادبه‌نفس با آمادگی و تجربه ساخته می‌شود.",b:"اعتمادبه‌نفس یعنی باور به توانایی خودتان بدون مقایسه.\n## راه‌ها\n- نقاط قوت و دستاوردهایتان را بنویسید\n- جواب سوال‌های رایج را تمرین کنید\n- با افراد حمایت‌گر باشید\n- اشتباه را فرصت یادگیری ببینید\n- قدم‌های کوچک بردارید و به‌خاطر هر کدام از خودتان قدردانی کنید\n## نکته\nاگر مضطرب هستید، آهسته نفس بکشید و صحبتتان را آرام‌تر کنید."},

{id:"negotiation-skill",c:"مهارت",t:"مهارت مذاکره در کار روزمره",s:"مذاکره فقط برای حقوق نیست؛ در روابط کاری هم هر روز لازم است.",b:"مذاکره یعنی رسیدن به توافقی که برای هر دو طرف قابل‌قبول باشد.\n## اصول\n- هدف و حداقل قابل‌قبول را مشخص کنید\n- نیاز طرف مقابل را بپرسید\n- با آرامش و احترام صحبت کنید\n- گزینه‌های جایگزین پیشنهاد دهید\n- توافق را مکتوب کنید\n## اشتباه رایج\nتصمیم عجولانه و صحبت از موضع تهدید."},

{id:"basic-computer",c:"مهارت",t:"مهارت‌های پایه کامپیوتر برای کارجو",s:"کار با کامپیوتر در بیشتر مشاغل کمک بزرگی است.",b:"آشنایی پایه با کامپیوتر دایره انتخاب شما را بیشتر می‌کند.\n## موارد مهم\n- کار با ویندوز و مدیریت فایل\n- ورد، اکسل و پاورپوینت\n- ایمیل و جست‌وجوی اینترنتی\n- امنیت پایه (رمز عبور و فیشینگ)\n## یادگیری\nدوره‌های رایگان آنلاین و کتاب‌های آموزشی ساده کافی است. بعد از یادگیری، حتماً در رزومه و مصاحبه نشان بدهید."},

{id:"continuous-learning",c:"پیشرفت شغلی",t:"یادگیری مداوم؛ راز ماندگاری در بازار کار",s:"بازار کار تغییر می‌کند و مهارت امروز فردا کافی نیست.",b:"کسانی که یاد می‌گیرند، کمتر کار از دست می‌دهند.\n## عادت‌های مفید\n- هر ماه یک مهارت کوچک تازه یاد بگیرید\n- مقاله و ویدیو آموزشی ببینید\n- پروژه کوچک بسازید\n- با افراد هم‌رشته ارتباط داشته باشید\n- هر مهارت جدید را در رزومه ثبت کنید\nیادگیری کوتاه ولی مداوم از دوره‌های طولانی و ناتمام بهتر است."},

{id:"get-promoted",c:"پیشرفت شغلی",t:"چطور ارتقا بگیریم؟",s:"ارتقا با عملکرد و دیده‌شدن همراه است.",b:"فقط سخت‌کوشی کافی نیست؛ باید دیده شود.\n## توصیه‌ها\n- نتیجه کارهایتان را مستند کنید\n- مسئولیت‌های بیشتر بپذیرید\n- مهارت‌های لازم برای نقش بالاتر را یاد بگیرید\n- هدف خود را با مدیر در میان بگذارید\n- درباره مسیر رشد سوال کنید\n## یادآوری\nصبور و پیگیر باشید ولی در صورت نبود مسیر رشد، گزینه‌های دیگر را هم بررسی کنید."},

{id:"ask-raise",c:"پیشرفت شغلی",t:"درخواست افزایش حقوق؛ زمان و روش",s:"با آمادگی و مستندات، درخواست شما جدی‌تر گرفته می‌شود.",b:"درخواست افزایش حقوق بخشی از رشد شغلی است.\n## قبل از درخواست\n- دستاوردهای خود را فهرست کنید\n- حقوق مشابه در بازار را بررسی کنید\n- زمان مناسب (بعد از موفقیت یا ارزیابی) را انتخاب کنید\n## هنگام گفتگو\n- مودب و روشن صحبت کنید\n- عدد یا بازه معقول بگویید\n- اگر امکانش نبود، مزایای دیگر یا زمان بررسی بعدی را بپرسید\nبه نتیجه، با آرامش پاسخ بدهید."},

{id:"personal-brand",c:"پیشرفت شغلی",t:"برند شخصی؛ معرفی حرفه‌ای خودمان",s:"برند شخصی یعنی دیگران چه تصویری از مهارت و شخصیت حرفه‌ای شما دارند.",b:"برای ساختن برند شخصی لازم نیست معروف باشید.\n## قدم‌ها\n- مشخص کنید در چه حوزه‌ای تخصص دارید\n- نمونه‌کار و تجربه‌هایتان را منتشر کنید\n- محتوای مفید و صادقانه بنویسید\n- با هم‌حوزه‌ها ارتباط بگیرید\n- رفتار حرفه‌ای را در همه جا حفظ کنید\n## نتیجه\nوقتی مردم شما را با مهارت خاصی بشناسند، فرصت‌ها خودشان به سراغتان می‌آیند."},

{id:"mentor",c:"پیشرفت شغلی",t:"منتور؛ چرا و چطور پیدا کنیم؟",s:"یک راهنمای باتجربه، مسیر را کوتاه می‌کند.",b:"منتور کسی است که از تجربه‌اش برای راهنمایی شما استفاده می‌کنید.\n## چطور پیدا کنیم؟\n- از افراد باتجربه در حوزه خودتان بخواهید\n- سوال مشخص و محترمانه مطرح کنید\n- وقت آن‌ها را گرامی بدارید\n- پیشرفت خود را اطلاع بدهید\n## نکته\nمنتور جای تلاش شما را نمی‌گیرد. او راه را نشان می‌دهد، ولی قدم برداشتن با خودتان است."},

{id:"career-roadmap",c:"پیشرفت شغلی",t:"نقشه راه شغلی سه‌ساله",s:"نقشه راه، تلاش‌های پراکنده را به یک مسیر تبدیل می‌کند.",b:"مسیر شغلی را می‌شود قدم‌به‌قدم طراحی کرد.\n## چطور بنویسیم؟\n- شغل مطلوب ۳ سال دیگر چیست؟\n- چه مهارت‌ها و مدارکی لازم است؟\n- هر سال چه هدفی دارید؟\n- هر ماه چه قدمی برمی‌دارید؟\n## بازبینی\nهر سه ماه نقشه را مرور کنید و اگر لازم شد اصلاح کنید. نقشه ثابت نیست؛ هدفش جهت‌دادن است."},

{id:"skill-courses",c:"پیشرفت شغلی",t:"انتخاب دوره آموزشی مناسب",s:"هر دوره‌ای ارزش ندارد؛ انتخاب درست مهم است.",b:"قبل از ثبت‌نام، چند نکته را بررسی کنید.\n## معیارها\n- ارتباط با شغل هدف\n- اعتبار برگزارکننده و گواهی\n- سرفصل‌ها و نمونه کار دانشجویان\n- نظر افرادی که دوره را گذرانده‌اند\n- هزینه و زمان\n## هشدار\nوعده‌های «استخدام تضمینی» یا درآمد غیرواقعی را جدی نگیرید و قبل از پرداخت، تحقیق کنید."}
];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fa(n){return String(n).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d]})}
function mins(a){return Math.max(1,Math.round(a.b.split(/\s+/).length/180))}
function body(a){
  var out="",ul=false;
  a.b.split("\n").forEach(function(l){
    l=l.trim();if(!l)return;
    if(l.indexOf("- ")===0){if(!ul){out+="<ul>";ul=true}out+="<li>"+esc(l.slice(2))+"</li>";return}
    if(ul){out+="</ul>";ul=false}
    out+=l.indexOf("## ")===0?"<h3>"+esc(l.slice(3))+"</h3>":"<p>"+esc(l)+"</p>";
  });
  return out+(ul?"</ul>":"");
}
var cat="",qs="";
function cats(){var c=[];A.forEach(function(a){if(c.indexOf(a.c)<0)c.push(a.c)});return c}
function renderList(){
  $("ch").innerHTML=["",].concat(cats()).map(function(c){return '<button data-c="'+esc(c)+'" class="'+(c===cat?"on":"")+'">'+(c||"همه")+'</button>'}).join("");
  var L=A.filter(function(a){return(!cat||a.c===cat)&&(!qs||(a.t+" "+a.s+" "+a.b).indexOf(qs)>-1)});
  $("st").textContent=fa(L.length)+" مقاله";
  $("ls").innerHTML=L.length?L.map(function(a){return '<a class="ac" href="#'+a.id+'"><div class="mt"><span class="tg">'+esc(a.c)+'</span><span>'+fa(mins(a))+' دقیقه مطالعه</span></div><h3>'+esc(a.t)+'</h3><p>'+esc(a.s)+'</p></a>'}).join(""):'<div class="em">مقاله‌ای پیدا نشد</div>';
}
function route(){
  var id=decodeURIComponent(location.hash.slice(1)),a=A.filter(function(x){return x.id===id})[0];
  if(!a){$("rv").hidden=true;$("lv").hidden=false;document.title="مقالات | گرگان جاب";renderList();return}
  var i=A.indexOf(a),n=A[(i+1)%A.length];
  $("lv").hidden=true;$("rv").hidden=false;document.title=a.t+" | گرگان جاب";
  $("rv").innerHTML='<button class="bk" id="bk">→ همه مقالات</button><div class="mt"><span class="tg">'+esc(a.c)+'</span><span>'+fa(mins(a))+' دقیقه مطالعه</span></div><h1>'+esc(a.t)+'</h1>'+body(a)
   +'<div class="cta">📄 رزومه‌ات را همین‌جا رایگان بساز و 📝 با آزمون‌های آمادگی تمرین کن.<br><a href="index.html">رزومه‌ساز</a><a href="azmoon.html">آزمون‌ها</a></div>'
   +'<a class="ac nx" href="#'+n.id+'"><div class="mt"><span class="tg">مقاله بعدی</span></div><h3>'+esc(n.t)+'</h3></a>';
  $("bk").onclick=function(){location.hash=""};
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){var c=e.target.getAttribute&&e.target.getAttribute("data-c");if(c!==null&&c!==undefined&&e.target.closest("#ch")){cat=c;renderList()}});
$("q").addEventListener("input",function(){qs=this.value.trim();renderList()});
window.addEventListener("hashchange",route);
route();
</script>
<script src="pwa.js" defer></script>
